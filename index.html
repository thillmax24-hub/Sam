
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101015">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crimson Guide">
<link rel="manifest" href="./manifest.json">

<title>Crimson Guide 4.1</title>
<style>
:root{
--bg:#101015;
--panel:#1d1c23;
--panel2:#292731;
--line:#40383d;
--text:#f6f2ec;
--muted:#aaa5ad;
--gold:#e2bd7b;
--red:#9e3e4b;
--green:#78c9a2;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;
background:radial-gradient(ellipse at 85% 0%,#44252b45,transparent 38%),var(--bg);
color:var(--text);
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{
outline:2px solid var(--gold);outline-offset:2px
}
a{color:var(--gold)}
.layout{display:flex;min-height:100dvh}
aside{
width:225px;flex-shrink:0;background:#17171e;
border-right:1px solid var(--line);padding:20px 12px
}
.brand{font-size:21px;font-weight:900;color:var(--gold);padding:12px}
.brand small{
display:block;font-size:10px;letter-spacing:2px;
color:var(--muted);margin-top:5px
}
nav{display:grid;gap:5px;margin-top:20px}
nav button{
border:0;background:none;color:var(--muted);
padding:13px;border-radius:10px;text-align:left
}
nav button.active{background:#4a292e;color:white}
main{
width:100%;max-width:1250px;min-width:0;
margin:auto;padding:22px;align-self:flex-start
}
header{
display:flex;justify-content:space-between;
align-items:center;gap:10px;margin-bottom:22px
}
.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold)}
h1{font-size:clamp(27px,4vw,39px);margin:8px 0 15px}
h2{font-size:20px}
h3{font-size:16px}
p{color:var(--muted);line-height:1.55}
.small{font-size:13px;color:var(--muted)}
.card{
background:var(--panel);border:1px solid var(--line);
border-radius:14px;padding:17px;margin-bottom:12px
}
.hero,.chapterHero{
background:linear-gradient(135deg,#4a262f 0%,#29222a 46%,#19191f 100%);
border:1px solid #72515a;border-radius:18px;
padding:24px;margin-bottom:19px;box-shadow:0 14px 40px #0002
}
.hero p,.chapterHero p{color:#d4c5c4}
.grid{
display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px
}
.grid .card{margin:0}
.btn{
display:inline-flex;justify-content:center;align-items:center;gap:7px;
background:var(--red);color:white;border:0;border-radius:10px;
padding:11px 15px;font-weight:650;text-decoration:none
}
.btn.alt{background:#30343e}
.btn.gold{
background:linear-gradient(115deg,#e4c38b,#bd8b55);color:#201b1b
}
.btn.smallbtn{padding:8px 11px;font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
input[type=search],input[type=text],select{
background:var(--panel2);border:1px solid var(--line);
color:white;border-radius:10px;padding:11px;min-width:0
}
input[type=search]{flex:1;min-width:140px}
input[type=checkbox]{accent-color:var(--red);width:17px;height:17px}
.between{
display:flex;justify-content:space-between;align-items:center;gap:10px
}
.meter{
height:9px;background:#373943;border-radius:20px;overflow:hidden
}
.meter div{
height:100%;background:linear-gradient(90deg,#a74250,#d8b77c)
}
.counter{
font-weight:800;font-variant-numeric:tabular-nums;
color:var(--gold);white-space:nowrap
}
.sectionHeading{margin:27px 0 14px;color:#f1e6d4}
.chapterGrid{
display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px
}
.chapterCard{
display:flex;align-items:center;gap:13px;min-width:0;width:100%;
background:linear-gradient(120deg,#25222a,#1a1b22);
border:1px solid #494047;border-radius:15px;
padding:17px;color:var(--text);text-align:left;
transition:transform .15s,border-color .15s
}
.chapterCard:hover{transform:translateY(-2px);border-color:var(--gold)}
.chapterCard:active{transform:scale(.99)}
.chapterIcon{
display:grid;place-items:center;flex:0 0 44px;
width:44px;height:44px;border-radius:12px;
background:#56333a;color:#e9bd79;font-size:23px
}
.chapterContent{flex:1;min-width:0}
.chapterTop{
display:flex;justify-content:space-between;align-items:center;gap:8px
}
.chapterTop strong{font-size:16px}
.chapterSubtitle{
display:block;color:var(--muted);font-size:12px;
margin:5px 0 12px;white-space:nowrap;
overflow:hidden;text-overflow:ellipsis
}
.chapterProgress{display:block}
.chapterProgress .meter{height:7px}
.chapterArrow,.chevron{color:var(--gold);font-size:24px}
.chapterComplete{border-color:#59735d}
.chapterComplete .chapterIcon{background:#294638;color:#9de1b0}
.crumb{
display:flex;flex-wrap:wrap;align-items:center;gap:9px;
color:var(--muted);font-size:13px;margin:2px 0 16px
}
.textbtn{
border:0;background:transparent;color:var(--gold);
padding:6px 0;text-align:left
}
.textbtn:hover{text-decoration:underline}
.questDetailHero{
padding:22px 24px;border-radius:16px;
background:linear-gradient(130deg,#462630,#211e27);
border:1px solid #60414a;margin-bottom:16px
}
.questDetailHero h1{margin:8px 0}
.questrow{
display:flex;align-items:center;gap:12px;padding:13px;
background:var(--panel);border:1px solid var(--line);
border-radius:11px;margin-bottom:8px
}
.questrow:hover{border-color:#79606a}
.questrow.completed{background:#1d2a26}
.questrow button{
flex:1;min-width:0;background:none;border:0;
color:white;text-align:left
}
.questrow button strong{display:block;font-size:16px}
.questrow button small{
display:block;color:var(--muted);margin-bottom:5px
}
.completeLine{display:flex;gap:12px;align-items:center;font-weight:650}
.step{
display:flex;gap:10px;align-items:flex-start;
background:var(--panel2);border-radius:10px;
padding:13px;margin-bottom:8px;line-height:1.5
}
.questmeta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.questtag{
border:1px solid var(--line);border-radius:20px;
padding:6px 10px;color:var(--muted);font-size:12px
}
.solutionhidden{
padding:22px;text-align:center;border:1px dashed var(--line);
border-radius:12px;margin-top:12px;color:var(--muted)
}
.notice{
padding:12px;background:#2c281f;border-left:3px solid var(--gold);
color:#e7d5b5;font-size:13px;margin:12px 0
}
.empty{
border:1px dashed var(--line);border-radius:12px;
padding:26px;text-align:center;color:var(--muted)
}
.maptools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.mapwrap{
position:relative;height:min(65vh,620px);min-height:350px;
border-radius:15px;border:1px solid var(--line);
overflow:hidden;background:#242a31;
touch-action:none;cursor:grab
}
.mapworld{
position:absolute;inset:0;transform-origin:center;
background:
radial-gradient(ellipse at 35% 35%,#48574a,transparent 48%),
radial-gradient(ellipse at 72% 68%,#535063,transparent 49%),
repeating-linear-gradient(0deg,transparent 0 49px,#ffffff0a 50px),
repeating-linear-gradient(90deg,transparent 0 49px,#ffffff0a 50px),
#28323a
}
.mapcenter{
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
text-align:center;color:#dbc398;
pointer-events:none;font-size:23px;letter-spacing:2px;opacity:.8
}
.mapcenter small{display:block;font-size:10px;margin-top:8px}
.mapmarker{
position:absolute;transform:translate(-50%,-50%);
width:34px;height:34px;border-radius:50%;
border:2px solid #fff3d8;background:#a8424b;
color:white;display:grid;place-items:center;z-index:4
}
.mapmarker.player{background:#1b86dc}
.mapmarker.target{background:#c18c2b}
.mapmarker.completed{opacity:.5}
.route{
position:absolute;inset:0;width:100%;height:100%;
pointer-events:none;z-index:2
}
.route line{
stroke:#f4d084;stroke-width:.7;
stroke-dasharray:1.5 1;vector-effect:non-scaling-stroke
}
.markerrow{
display:flex;align-items:center;gap:10px;padding:12px;
background:var(--panel);border:1px solid var(--line);
border-radius:10px;margin-bottom:7px
}
.markerrow .name{flex:1;min-width:0}
.markerrow strong{display:block}
.markerrow small{color:var(--muted)}
.mobileNav{display:none}
footer{font-size:11px;color:var(--muted);margin-top:35px}
@media(max-width:800px){
.chapterGrid{grid-template-columns:1fr}
.chapterCard{padding:15px}
.chapterHero{padding:19px}
.chapterIcon{flex-basis:40px;width:40px;height:40px}
}
@media(max-width:760px){
.layout{display:block}
aside{display:none}
main{padding:15px 13px 105px}
.hero{padding:20px}
.grid{gap:9px}
.grid .card{padding:13px}
.mapwrap{height:53dvh;min-height:320px}
.mobileNav{
position:fixed;bottom:0;left:0;right:0;z-index:50;
display:flex;justify-content:space-around;background:#191b22;
border-top:1px solid var(--line);
padding:7px 3px calc(7px + env(safe-area-inset-bottom))
}
.mobileNav button{
flex:1;display:flex;flex-direction:column;align-items:center;
gap:4px;border:0;background:none;color:var(--muted);
padding:7px 2px;font-size:10px
}
.mobileNav button.active{color:var(--gold)}
.mobileNav .ico{font-size:22px}
}
</style>
</head>

function slug(s){
return s.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"");
}

const originalIds=[
"unfamiliar-lands",
"in-ashes",
"realm-of-uncertainty",

"where-rumors-gather",

const quests=[];

mainQuestNames.forEach((text,chapter)=>{
text.split("|").forEach((name,index)=>{
let id;
if(chapter===0||chapter===1){
id=originalIds[chapter===0?index:index+4];
}else if(chapter===2&&index<4){
id=slug(name);
}else{
id="c"+chapter+"-"+slug(name);
}
quests.push({
id,
name,
chapter,
type:"main"
});
});
});

Object.entries(sideQuestNames).forEach(([region,names])=>{
names.split("|").forEach((name,index)=>{
quests.push({
id:"side-"+region.toLowerCase()+"-"+(index+1),
name,
chapter:region,
type:"side"
});
});
});

function readObject(key){
try{
const v=JSON.parse(localStorage.getItem(key)||"{}");
return v&&typeof v==="object"&&!Array.isArray(v)?v:{};
}catch{return {}}
}

function readArray(key){
try{
const v=JSON.parse(localStorage.getItem(key)||"[]");
return Array.isArray(v)?v:[];
}catch{return []}
}

function validPoint(p){
return p&&Number.isFinite(p.x)&&Number.isFinite(p.y)
&&p.x>=0&&p.x<=100&&p.y>=0&&p.y<=100;
}

function readPoint(key){
const p=readObject(key);
return validPoint(p)?{x:p.x,y:p.y}:null;
}

function esc(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
})[c]);
}

const legacy=readObject("crimson-guide-progress-v1");

for(const q of quests){
if(legacy["quests:"+q.id]===true&&progress["quest:"+q.id]===undefined){
progress["quest:"+q.id]=true;
}
}

const types=["quest","boss","treasure","npc","material","other"];

let markers=readArray(MARKERS_KEY)
.filter(m=>validPoint(m)&&typeof m.name==="string")
.slice(0,500)
.map(m=>({
id:String(m.id||"m"+Math.random()),
name:m.name.slice(0,100),
type:types.includes(m.type)?m.type:"other",
x:m.x,
y:m.y,
completed:m.completed===true
}));

const chapter=typeof q==="object"?q.chapter:q;
if(typeof chapter==="string")return chapter;
if(chapter===0)return t("prologue");
if(chapter===13)return t("epilogue");
if(chapter===2){
return language==="de"
?"Kapitel 2 – Golden Greed"
:"Chapter 2 – Golden Greed";
}
return t("chapter")+" "+chapter;
}

function save(){
localStorage.setItem(PROGRESS_KEY,JSON.stringify(progress));
localStorage.setItem(MARKERS_KEY,JSON.stringify(markers));

if(player){
localStorage.setItem(POSITION_KEY,JSON.stringify(player));
}else{
localStorage.removeItem(POSITION_KEY);
}

if(target){
localStorage.setItem(TARGET_KEY,JSON.stringify(target));
}else{
localStorage.removeItem(TARGET_KEY);
}
}

function stepDone(id,i){

function setupMap(){
const wrap=document.getElementById("mapwrap");
const world=document.getElementById("mapworld");

function transform(){
world.style.transform=
`translate(${offsetX}px,${offsetY}px) scale(${zoom})`;
}

document.getElementById("zoomIn").onclick=()=>{
zoom=Math.min(4,zoom+.25);
transform();
};

document.getElementById("zoomOut").onclick=()=>{
zoom=Math.max(.6,zoom-.25);
transform();
};

document.getElementById("resetView").onclick=()=>{
zoom=1;
offsetX=0;
offsetY=0;
transform();
};

document.querySelectorAll("[data-mode]").forEach(b=>{
b.onclick=()=>{
mapMode=mapMode===b.dataset.mode?"pan":b.dataset.mode;
render();
};
});

document.getElementById("clearPlayer")?.addEventListener("click",()=>{
player=null;
save();
render();
});

document.getElementById("clearTarget")?.addEventListener("click",()=>{
target=null;
save();
render();
});

document.querySelectorAll("[data-targetmarker]").forEach(b=>{
b.onclick=()=>{
const m=markers.find(x=>x.id===b.dataset.targetmarker);
if(m){
target={x:m.x,y:m.y};
save();
render();
}
};
});

document.querySelectorAll("[data-donemarker]").forEach(b=>{
b.onclick=()=>{
const m=markers.find(x=>x.id===b.dataset.donemarker);
if(m){
m.completed=!m.completed;
save();
render();
}
};
});

document.querySelectorAll("[data-deletemarker]").forEach(b=>{
b.onclick=()=>{
markers=markers.filter(m=>m.id!==b.dataset.deletemarker);
save();
render();
};
});

document.querySelectorAll("[data-marker]").forEach(b=>{
b.onclick=e=>{
e.stopPropagation();
const m=markers.find(x=>x.id===b.dataset.marker);
if(m)alert(m.name+" · "+m.type);
};
});

let dragging=false;
let moved=false;
let lastX=0;
let lastY=0;
let startX=0;
let startY=0;

wrap.addEventListener("pointerdown",e=>{
if(e.target.closest("button"))return;
dragging=true;
moved=false;
startX=lastX=e.clientX;
startY=lastY=e.clientY;
wrap.setPointerCapture(e.pointerId);
});

wrap.addEventListener("pointermove",e=>{
if(!dragging)return;

if(Math.hypot(e.clientX-startX,e.clientY-startY)>7){
moved=true;
}

if(mapMode==="pan"){
offsetX+=e.clientX-lastX;
offsetY+=e.clientY-lastY;
transform();
}

lastX=e.clientX;
lastY=e.clientY;
});

wrap.addEventListener("pointerup",e=>{
if(!dragging)return;
dragging=false;

if(moved||mapMode==="pan")return;

const rect=wrap.getBoundingClientRect();
const cx=rect.width/2;
const cy=rect.height/2;

const px=(e.clientX-rect.left-cx-offsetX)/zoom+cx;
const py=(e.clientY-rect.top-cy-offsetY)/zoom+cy;

const x=px/rect.width*100;
const y=py/rect.height*100;

if(x<0||x>100||y<0||y>100)return;

if(mapMode==="player"){
player={x,y};
mapMode="pan";
save();
render();
return;
}

if(mapMode==="target"){
target={x,y};
mapMode="pan";
save();
render();
return;
}

if(mapMode==="marker"){
const name=prompt(
language==="de"?"Name des Fundorts:":"Location name:"
);

if(!name?.trim())return;

const raw=prompt(
"Category: quest, boss, treasure, npc, material, other",
"other"
);

if(raw===null)return;

const type=types.includes(raw.trim().toLowerCase())
?raw.trim().toLowerCase()
:"other";

markers.push({
id:"m"+Date.now()+"-"+Math.random().toString(36).slice(2,8),
name:name.trim().slice(0,100),
type,
x,
y,
completed:false
});

mapMode="pan";
save();
render();
}
});

wrap.addEventListener("pointercancel",()=>{
dragging=false;
});

transform();
}

function setupSettings(){

document.getElementById("exportBtn").onclick=()=>{
const backup={
version:31,
progress,
markers,
player,
target,
exportedAt:new Date().toISOString()
};

const blob=new Blob(
[JSON.stringify(backup,null,2)],
{type:"application/json"}
);

const url=URL.createObjectURL(blob);
const a=document.createElement("a");

a.href=url;
a.download="crimson-guide-backup.json";
a.click();

setTimeout(()=>URL.revokeObjectURL(url),1000);
};

document.getElementById("importBtn").onclick=()=>{
document.getElementById("backupFile").click();
};

document.getElementById("backupFile").onchange=async e=>{
try{
const file=e.target.files[0];
if(!file)return;
if(file.size>1000000)throw Error("size");

const data=JSON.parse(await file.text());

if(![1,2,3,31].includes(data.version)
||!data.progress
||typeof data.progress!=="object"
||Array.isArray(data.progress)){
throw Error("format");
}

const clean={};

for(let [key,value] of Object.entries(data.progress)){
if(key.length>160||typeof value!=="boolean")continue;

if(data.version===1&&key.startsWith("quests:")){
key="quest:"+key.slice(7);
}

clean[key]=value;
}

progress=clean;

if(Array.isArray(data.markers)){
markers=data.markers
.filter(m=>validPoint(m)&&typeof m.name==="string")
.slice(0,500)
.map(m=>({
id:String(m.id||"m"+Math.random()).slice(0,100),
name:m.name.slice(0,100),
type:types.includes(m.type)?m.type:"other",
x:m.x,
y:m.y,
completed:m.completed===true
}));
}

if(data.version===31){
player=validPoint(data.player)?data.player:null;
target=validPoint(data.target)?data.target:null;
}

save();
alert(t("imported"));
render();

}catch{
alert(t("invalid"));
}
};

document.getElementById("resetBtn").onclick=()=>{
if(confirm(t("confirmReset"))){
progress={};
markers=[];
player=null;
target=null;
save();
render();
}
};
}

document.getElementById("lang").onchange=e=>{
language=e.target.value;
localStorage.setItem("crimson-guide-language",language);
render();
};

render();

if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("./sw.js").catch(()=>{});
});
}
</script>
