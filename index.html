<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Crimson Guide 4.3</title>
<style>
:root{
--bg:#121116;--panel:#211e25;--panel2:#302a33;
--line:#493b42;--red:#a84653;--gold:#e3bf82;
--text:#f7f2ec;--muted:#b1a6ad;--green:#8acaa3
}
*{box-sizing:border-box}
body{
margin:0;color:var(--text);
background:radial-gradient(ellipse at 80% 0%,#572b3444,transparent 42%),var(--bg);
font-family:system-ui,-apple-system,"Segoe UI",sans-serif
}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{
outline:2px solid var(--gold);outline-offset:2px
}
a{color:var(--gold)}
h1{font-size:clamp(27px,4vw,38px);margin:8px 0 16px}
h2{font-size:21px}
h3{font-size:16px}
p{color:var(--muted);line-height:1.6}
.layout{display:flex;min-height:100dvh}
aside{
width:225px;flex-shrink:0;background:#19171d;
border-right:1px solid var(--line);padding:18px 12px
}
.brand{font-size:21px;font-weight:900;color:var(--gold);padding:12px}
.brand small{
display:block;color:var(--muted);font-size:10px;
letter-spacing:2px;margin-top:5px
}
nav{display:grid;gap:5px;margin-top:20px}
nav button{
border:0;background:none;color:var(--muted);
text-align:left;padding:13px;border-radius:10px
}
nav button.active{background:#4d2a33;color:white}
main{
width:100%;max-width:1200px;min-width:0;
margin:auto;padding:22px;align-self:flex-start
}
header{
display:flex;justify-content:space-between;
align-items:center;gap:10px;margin-bottom:22px
}
.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold)}
.small{font-size:13px;color:var(--muted)}
.card{
background:var(--panel);border:1px solid var(--line);
border-radius:14px;padding:17px;margin-bottom:12px
}
.hero{
background:linear-gradient(135deg,#4e2833,#282029 60%,#19191e);
border:1px solid #77515b;border-radius:18px;
padding:24px;margin-bottom:18px
}
.hero p{color:#d8c7c7}
.grid{
display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px
}
.grid>.card{margin:0}
.btn{
display:inline-flex;align-items:center;justify-content:center;
gap:7px;border:0;background:var(--red);color:white;
border-radius:10px;padding:11px 15px;font-weight:650;
text-decoration:none
}
.btn.alt{background:#35313b}
.btn.gold{
background:linear-gradient(115deg,#e6c48a,#c2935e);
color:#231b1b
}
.btn.sm{padding:8px 11px;font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
input[type=search],input[type=text],select{
background:var(--panel2);border:1px solid var(--line);
color:white;border-radius:10px;padding:11px;min-width:0
}
input[type=search]{flex:1;min-width:130px}
input[type=checkbox]{
accent-color:var(--red);width:18px;height:18px
}
.between{
display:flex;justify-content:space-between;
align-items:center;gap:10px
}
.meter{
height:8px;background:#403942;border-radius:20px;
overflow:hidden
}
.meter>div{
height:100%;
background:linear-gradient(90deg,#ac4756,#e2bd82)
}
.counter{
font-weight:800;color:var(--gold);
font-variant-numeric:tabular-nums;white-space:nowrap
}
.chapterGrid{
display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px
}
.chapterCard{
display:flex;align-items:center;gap:13px;width:100%;
min-width:0;background:linear-gradient(115deg,#2b242d,#1d1c22);
border:1px solid var(--line);border-radius:15px;
padding:17px;color:white;text-align:left
}
.chapterCard:hover{border-color:var(--gold)}
.chapterCard.complete{border-color:#51715b}
.chapterIcon{
display:grid;place-items:center;flex:0 0 43px;
width:43px;height:43px;border-radius:12px;
background:#56313b;color:var(--gold);font-size:23px
}
.chapterContent{flex:1;min-width:0}
.chapterTop{
display:flex;justify-content:space-between;
align-items:center;gap:8px
}
.chapterSubtitle{
display:block;color:var(--muted);font-size:12px;
margin:6px 0 12px;white-space:nowrap;
overflow:hidden;text-overflow:ellipsis
}
.chapterArrow{font-size:24px;color:var(--gold)}
.sectionHeading{margin:28px 0 14px}
.crumb{
display:flex;align-items:center;gap:8px;flex-wrap:wrap;
margin:0 0 16px;font-size:13px;color:var(--muted)
}
.textbtn{border:0;background:none;color:var(--gold);padding:5px 0}
.questrow{
display:flex;align-items:center;gap:12px;padding:13px;
background:var(--panel);border:1px solid var(--line);
border-radius:11px;margin-bottom:8px
}
.questrow.completed{background:#1d2924}
.questrow button{
flex:1;min-width:0;border:0;background:none;
text-align:left;color:white
}
.questrow button strong{display:block}
.questrow button small{
display:block;color:var(--muted);margin-bottom:5px
}
.step{
display:flex;gap:11px;align-items:flex-start;
padding:14px;background:var(--panel2);
border-radius:10px;margin-bottom:8px;line-height:1.55
}
.step.checked span{text-decoration:line-through;color:var(--muted)}
.notice{
padding:13px;background:#312a20;border-left:3px solid var(--gold);
color:#ead5af;border-radius:4px;margin:13px 0;line-height:1.55
}
.empty{
padding:25px;border:1px dashed var(--line);
border-radius:12px;text-align:center;color:var(--muted)
}
.guideBox{
background:#29242c;border:1px solid #5e4650;
border-radius:14px;padding:17px;margin:15px 0
}
.guideBox h3{color:var(--gold);margin:0 0 8px}
.guideBox p{margin:7px 0}
.completeLine{display:flex;align-items:center;gap:12px;font-weight:700}
.mapwrap{
position:relative;height:min(62vh,600px);min-height:340px;
overflow:hidden;border-radius:14px;border:1px solid var(--line);
background:#29343c;touch-action:none
}
.mapworld{
position:absolute;inset:0;transform-origin:center;
background:
radial-gradient(ellipse at 30% 30%,#52634e,transparent 45%),
radial-gradient(ellipse at 75% 70%,#625c69,transparent 50%),
repeating-linear-gradient(0deg,transparent 0 49px,#ffffff0a 50px),
repeating-linear-gradient(90deg,transparent 0 49px,#ffffff0a 50px),
#303b43
}
.mapcenter{
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
text-align:center;color:#dfc38c;
font-size:24px;pointer-events:none
}
.mapcenter small{display:block;font-size:10px;margin-top:8px}
.mapmarker{
position:absolute;transform:translate(-50%,-50%);
width:34px;height:34px;border-radius:50%;
border:2px solid #fff0d6;background:#a84653;color:white;
display:grid;place-items:center;z-index:4
}
.mapmarker.player{background:#2589d4}
.mapmarker.target{background:#c19038}
.mapmarker.completed{opacity:.5}
.route{
position:absolute;inset:0;width:100%;height:100%;
pointer-events:none;z-index:2
}
.route line{
stroke:#ffdf91;stroke-width:.7;
stroke-dasharray:1.5 1;vector-effect:non-scaling-stroke
}
.markerrow{
display:flex;align-items:center;gap:10px;padding:12px;
background:var(--panel);border:1px solid var(--line);
border-radius:10px;margin-bottom:7px
}
.markerrow .name{flex:1;min-width:0}
.markerrow strong{display:block}
.markerrow small{color:var(--muted)}
.mobileNav{display:none}
footer{font-size:11px;color:var(--muted);margin-top:35px}
@media(max-width:800px){
.chapterGrid{grid-template-columns:1fr}
}
@media(max-width:760px){
.layout{display:block}
aside{display:none}
main{padding:15px 13px 105px}
.hero{padding:19px}
.grid{gap:9px}
.grid>.card{padding:13px}
.mapwrap{height:53dvh;min-height:320px}
.mobileNav{
display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
justify-content:space-around;background:#19191f;
border-top:1px solid var(--line);
padding:7px 3px calc(7px + env(safe-area-inset-bottom))
}
.mobileNav button{
flex:1;display:flex;flex-direction:column;align-items:center;
gap:4px;border:0;background:none;color:var(--muted);
padding:7px 2px;font-size:10px
}
.mobileNav button.active{color:var(--gold)}
.mobileNav .ico{font-size:22px}
}
</style>
</head>

function slug(s){
return s.toLowerCase().normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"");
}

function esc(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
})[c]);
}

"unfamiliar-lands",

"realm-of-uncertainty",

"woman-in-white"

const quests=[];

mainQuestNames.forEach((text,chapter)=>{
text.split("|").forEach((name,index)=>{
let id;
if(chapter===0||chapter===1){
id=originalIds[chapter===0?index:index+4];
}else if(chapter===2&&index<4){
id=slug(name);
}else{
id="c"+chapter+"-"+slug(name);
}
quests.push({id,name,chapter,type:"main"});
});
});

Object.entries(sideQuestNames).forEach(([region,text])=>{
text.split("|").forEach((name,index)=>{
quests.push({
id:"side-"+region.toLowerCase()+"-"+(index+1),
name,chapter:region,type:"side"
});
});
});

/* ==========================================
   STORAGE
   ========================================== */

function readObject(key){
try{
const v=JSON.parse(localStorage.getItem(key)||"{}");
return v&&typeof v==="object"&&!Array.isArray(v)?v:{};
}catch{return {}}
}

function readArray(key){
try{
const v=JSON.parse(localStorage.getItem(key)||"[]");
return Array.isArray(v)?v:[];
}catch{return []}
}

function validPoint(p){
return p&&
Number.isFinite(p.x)&&Number.isFinite(p.y)&&
p.x>=0&&p.x<=100&&p.y>=0&&p.y<=100;
}

function readPoint(key){
const p=readObject(key);
return validPoint(p)?{x:p.x,y:p.y}:null;
}

let progress=readObject(PROGRESS_KEY);
let markers=readArray(MARKERS_KEY)
.filter(m=>validPoint(m)&&typeof m.name==="string")
.slice(0,500);

let player=readPoint(POSITION_KEY);
let target=readPoint(TARGET_KEY);

let language=localStorage.getItem(LANGUAGE_KEY)==="en"?"en":"de";
let page="home";
let questView="chapters";
let activeGroup=null;
let selectedQuest=null;
let solutionVisible=false;
let questQuery="";
let questStatus="all";
let collectionTab="items";
let mapMode="pan";
let zoom=1,offsetX=0,offsetY=0;

const sections=[
["home","⌂"],
["map","🗺"],
["quests","📜"],
["collection","⚔"],
["progress","✓"],
["settings","⚙"]
];

const sideRegions=Object.keys(sideQuestNames);
const mainCount=quests.filter(q=>q.type==="main").length;
const sideCount=quests.filter(q=>q.type==="side").length;
const guideCount=Object.keys(allGuides).length;

function t(k){
return TXT[language][k]||k;
}

function save(){
localStorage.setItem(PROGRESS_KEY,JSON.stringify(progress));
localStorage.setItem(MARKERS_KEY,JSON.stringify(markers));

if(player){
localStorage.setItem(POSITION_KEY,JSON.stringify(player));
}else{
localStorage.removeItem(POSITION_KEY);
}

if(target){
localStorage.setItem(TARGET_KEY,JSON.stringify(target));
}else{
localStorage.removeItem(TARGET_KEY);
}
}

function questDone(id){
return progress["quest:"+id]===true;
}

function stepDone(id,i){
return progress["step:"+id+":"+i]===true;
}

function doneCount(){
return quests.filter(q=>questDone(q.id)).length;
}

function meter(n,total){
const value=total?100*n/total:0;
return `<div class="meter"><div style="width:${value}%"></div></div>`;
}

function chapterLabel(ch){
let c=typeof ch==="object"?ch.chapter:ch;

if(typeof c==="string"&&/^\d+$/.test(c)){
c=Number(c);
}

if(typeof c==="string")return c;
if(c===0)return language==="de"?"Prolog":"Prologue";
if(c===13)return language==="de"?"Epilog":"Epilogue";

return t("chapter")+" "+c;
}

function navigate(next){
page=next;
selectedQuest=null;
solutionVisible=false;

if(next==="quests"){
questView="chapters";
activeGroup=null;
questQuery="";
questStatus="all";
}

mapMode="pan";
render();
window.scrollTo(0,0);
}

const name=typeof group==="number"

return `

/* ==========================================
   MAP INTERACTION
   ========================================== */

function setupMap(){

const wrap=document.getElementById("mapwrap");
const world=document.getElementById("mapworld");

function transform(){
world.style.transform=
`translate(${offsetX}px,${offsetY}px) scale(${zoom})`;
}

document.getElementById("zoomIn").onclick=()=>{
zoom=Math.min(4,zoom+.25);
transform();
};

document.getElementById("zoomOut").onclick=()=>{
zoom=Math.max(.6,zoom-.25);
transform();
};

document.getElementById("resetView").onclick=()=>{
zoom=1;
offsetX=0;
offsetY=0;
transform();
};

document.querySelectorAll("[data-mode]").forEach(b=>{
b.onclick=()=>{
mapMode=mapMode===b.dataset.mode?"pan":b.dataset.mode;
render();
};
});

document.getElementById("clearPlayer")
?.addEventListener("click",()=>{
player=null;
save();
render();
});

document.getElementById("clearTarget")
?.addEventListener("click",()=>{
target=null;
save();
render();
});

document.querySelectorAll("[data-targetmarker]").forEach(b=>{
b.onclick=()=>{
const m=markers.find(
x=>String(x.id)===b.dataset.targetmarker
);

if(m){
target={x:m.x,y:m.y};
save();
render();
}
};
});

document.querySelectorAll("[data-donemarker]").forEach(b=>{
b.onclick=()=>{
const m=markers.find(
x=>String(x.id)===b.dataset.donemarker
);

if(m){
m.completed=!m.completed;
save();
render();
}
};
});

document.querySelectorAll("[data-deletemarker]").forEach(b=>{
b.onclick=()=>{
markers=markers.filter(
m=>String(m.id)!==b.dataset.deletemarker
);
save();
render();
};
});

document.querySelectorAll("[data-marker]").forEach(b=>{
b.onclick=e=>{
e.stopPropagation();

const m=markers.find(
x=>String(x.id)===b.dataset.marker
);

if(m)alert(m.name+" · "+m.type);
};
});

let dragging=false;
let moved=false;
let lastX=0,lastY=0;
let startX=0,startY=0;

wrap.addEventListener("pointerdown",e=>{
if(e.target.closest("button"))return;

dragging=true;
moved=false;
startX=lastX=e.clientX;
startY=lastY=e.clientY;

wrap.setPointerCapture(e.pointerId);
});

wrap.addEventListener("pointermove",e=>{
if(!dragging)return;

if(Math.hypot(
e.clientX-startX,
e.clientY-startY
)>7){
moved=true;
}

if(mapMode==="pan"){
offsetX+=e.clientX-lastX;
offsetY+=e.clientY-lastY;
transform();
}

lastX=e.clientX;
lastY=e.clientY;
});

wrap.addEventListener("pointerup",e=>{
if(!dragging)return;

dragging=false;

if(moved||mapMode==="pan")return;

const rect=wrap.getBoundingClientRect();
const cx=rect.width/2;
const cy=rect.height/2;

const px=
(e.clientX-rect.left-cx-offsetX)/zoom+cx;

const py=
(e.clientY-rect.top-cy-offsetY)/zoom+cy;

const x=px/rect.width*100;
const y=py/rect.height*100;

if(x<0||x>100||y<0||y>100)return;

if(mapMode==="player"){
player={x,y};
mapMode="pan";
save();
render();
return;
}

if(mapMode==="target"){
target={x,y};
mapMode="pan";
save();
render();
return;
}

if(mapMode==="marker"){

const name=prompt(
language==="de"?"Name des Fundorts:":"Location name:"
);

if(!name?.trim())return;

const raw=prompt(
"Category: quest, boss, treasure, npc, material, other",
"other"
);

if(raw===null)return;

const types=[
"quest","boss","treasure","npc","material","other"
];

const type=types.includes(raw.trim().toLowerCase())
?raw.trim().toLowerCase()
:"other";

markers.push({
id:"m"+Date.now()+"-"+Math.random().toString(36).slice(2,8),
name:name.trim().slice(0,100),
type,x,y,
completed:false
});

mapMode="pan";
save();
render();
}
});

wrap.addEventListener("pointercancel",()=>{
dragging=false;
});

transform();
}

/* ==========================================
   BACKUP / IMPORT / RESET
   ========================================== */

function setupSettings(){

document.getElementById("exportBtn").onclick=()=>{

const backup={
version:31,
progress,
markers,
player,
target,
exportedAt:new Date().toISOString()
};

const blob=new Blob(
[JSON.stringify(backup,null,2)],
{type:"application/json"}
);

const url=URL.createObjectURL(blob);
const a=document.createElement("a");

a.href=url;
a.download="crimson-guide-backup.json";
a.click();

setTimeout(()=>URL.revokeObjectURL(url),1000);
};

document.getElementById("importBtn").onclick=()=>{
document.getElementById("backupFile").click();
};

document.getElementById("backupFile").onchange=async e=>{

try{

const file=e.target.files[0];
if(!file)return;

if(file.size>1000000){
throw Error("size");
}

const data=JSON.parse(await file.text());

if(
![1,2,3,31].includes(data.version)||
!data.progress||
typeof data.progress!=="object"||
Array.isArray(data.progress)
){
throw Error("format");
}

const clean={};

for(let [key,value] of Object.entries(data.progress)){

if(key.length>160||typeof value!=="boolean")continue;

if(data.version===1&&key.startsWith("quests:")){
key="quest:"+key.slice(7);
}

clean[key]=value;
}

progress=clean;

if(Array.isArray(data.markers)){

markers=data.markers
.filter(m=>validPoint(m)&&typeof m.name==="string")
.slice(0,500)
.map(m=>({
id:String(m.id||"m"+Math.random()).slice(0,100),
name:m.name.slice(0,100),
type:[
"quest","boss","treasure","npc","material","other"
].includes(m.type)?m.type:"other",
x:m.x,
y:m.y,
completed:m.completed===true
}));
}

if(data.version===31){
player=validPoint(data.player)?data.player:null;
target=validPoint(data.target)?data.target:null;
}

save();
alert(t("imported"));
render();

}catch{
alert(t("invalid"));
}
};

document.getElementById("resetBtn").onclick=()=>{

if(confirm(t("confirmReset"))){
progress={};
markers=[];
player=null;
target=null;
save();
render();
}
};
}

render();

navigator.serviceWorker.register("./sw.js").catch(()=>{});
