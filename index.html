
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crimson Guide">
<title>Crimson Guide 4.0</title>
<style>
:root{
--bg:#101116;--panel:#1c1e26;--panel2:#282b35;
--line:#373943;--text:#f6f2ec;--muted:#aaaab5;
--gold:#e0b979;--red:#af424c;--green:#78c9a2
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}
.layout{display:flex;min-height:100dvh}
aside{width:225px;flex-shrink:0;background:#171920;border-right:1px solid var(--line);padding:20px 12px}
.brand{font-size:21px;font-weight:900;color:var(--gold);padding:12px}
.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:5px}
nav{display:grid;gap:5px;margin-top:20px}
nav button{border:0;background:none;color:var(--muted);padding:13px;border-radius:10px;text-align:left}
nav button.active{background:#4a292e;color:white}
main{width:100%;max-width:1250px;min-width:0;margin:auto;padding:22px;align-self:flex-start}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold)}
h1{font-size:clamp(27px,4vw,39px);margin:8px 0 15px}
h2{font-size:20px}h3{font-size:16px}
p{color:var(--muted);line-height:1.55}
.small{font-size:13px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:12px}
.hero{background:linear-gradient(125deg,#542b32,#1c1e26);border:1px solid #77444b;padding:26px;border-radius:16px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid .card{margin:0}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:7px;background:var(--red);color:white;border:0;border-radius:10px;padding:11px 15px;font-weight:650;text-decoration:none}
.btn.alt{background:#30343e}
.btn.gold{background:var(--gold);color:#171515}
.btn.smallbtn{padding:8px 11px;font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
input[type=search],input[type=text],select{background:var(--panel2);border:1px solid var(--line);color:white;border-radius:10px;padding:11px;min-width:0}
input[type=search]{flex:1;min-width:140px}
input[type=checkbox]{accent-color:var(--red);width:17px;height:17px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.meter{height:9px;background:#373943;border-radius:20px;overflow:hidden}
.meter div{height:100%;background:var(--red)}
.questrow{display:flex;align-items:center;gap:12px;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:8px}
.questrow button{flex:1;min-width:0;background:none;border:0;color:white;text-align:left}
.questrow button strong{display:block}
.questrow button small{display:block;color:var(--muted);margin-top:4px}
.step{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border-radius:10px;padding:13px;margin-bottom:8px;line-height:1.5}
.notice{padding:12px;background:#2c281f;border-left:3px solid var(--gold);color:#e7d5b5;font-size:13px;margin:12px 0}
.empty{border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted)}
.questtag{display:inline-block;background:#343039;color:var(--gold);padding:7px 11px;border-radius:30px;font-size:12px;margin:0 6px 12px 0}
.solutionhidden{border:1px dashed #74565c;border-radius:12px;padding:24px;text-align:center;color:var(--muted);margin-top:12px}
.maptools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.mapwrap{position:relative;height:min(65vh,620px);min-height:350px;border-radius:15px;border:1px solid var(--line);overflow:hidden;background:#242a31;touch-action:none;cursor:grab}
.mapworld{position:absolute;inset:0;transform-origin:center;background:radial-gradient(ellipse at 35% 35%,#48574a,transparent 48%),radial-gradient(ellipse at 72% 68%,#535063,transparent 49%),repeating-linear-gradient(0deg,transparent 0 49px,#ffffff0a 50px),repeating-linear-gradient(90deg,transparent 0 49px,#ffffff0a 50px),#28323a}
.mapcenter{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#dbc398;pointer-events:none;font-size:23px;letter-spacing:2px;opacity:.8}
.mapcenter small{display:block;font-size:10px;margin-top:8px}
.mapmarker{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:2px solid #fff3d8;background:#a8424b;color:white;display:grid;place-items:center;z-index:4}
.mapmarker.player{background:#1b86dc}
.mapmarker.target{background:#c18c2b}
.mapmarker.completed{opacity:.5}
.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.route line{stroke:#f4d084;stroke-width:.7;stroke-dasharray:1.5 1;vector-effect:non-scaling-stroke}
.markerrow{display:flex;align-items:center;gap:10px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:7px}
.markerrow .name{flex:1;min-width:0}
.markerrow strong{display:block}
.markerrow small{color:var(--muted)}
.mobileNav{display:none}
footer{font-size:11px;color:var(--muted);margin-top:35px}
@media(max-width:760px){
.layout{display:block}aside{display:none}
main{padding:15px 13px 105px}
.hero{padding:20px}
.grid{gap:9px}
.grid .card{padding:13px}
.mapwrap{height:53dvh;min-height:320px}
.mobileNav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:space-around;background:#191b22;border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom))}
.mobileNav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:var(--muted);padding:7px 2px;font-size:10px}
.mobileNav button.active{color:var(--gold)}
.mobileNav .ico{font-size:22px}
}
</style>
</head>

const mainQuestNames=[
`Unfamiliar Lands|In Ashes|Realm of Uncertainty|New Journey`,
`Where Rumors Gather|Mysterious Man|True Wisdom in Kindness|Actions Speak Louder than Words|Heart Beyond Borders|Mystical Key|Polar Opposites|Abyss Without Balance|Woman in White`,
`Where the Light Leads|Memory Fragment|Reunion|For Honor|Awestruck|Shadow Cast Over the River|Where Misery Gathers|Trial After Trial|The Man Trapped in the Mire|Missing Companion|Secrets Hidden in the Dark|The Dark Veil|The Flames of Greed|Kidnapped Healer|Rebellion or Revolution|Cheers Echoing From the Edge`,
`Old Friend|First Step to Rebuilding|A Fresh Start|Reward for Their Sweat|Return of the Comrade|Familiar Curses|Return|Traces in the Manor|Nonhuman|Seed of Unease|Dance with the Devil|Hope After the Draught|Scattered Comrades|Rumors from the Sawmill|A Gentle Touch|Bustling Hill|Greymanes Reunited`,
`Kilnden Workshop|Kiln Repair at the Kilnden Workshop|The Mysterious Pot|The Iron Pot’s Usage|Disturbance at the Arena|Skilled in Archery|The Words of Alustin|Scholastone|On the Right Path|Gate to the Otherworld|Spire of the Stars|Obsession and Madness|Casted Shadow`,
`Double-sided Invitation|Unwelcomed Guests|Demenissian Delegation|Exposed Plot|The Missing Seal|Crowcaller|The Crow’s Warning|Bloodwind|Secret at the Church|Toward the Nest (Spire of Soaring)`,
`News|To the Battlefield|The Counterattack|Cradle of Defense|The Touch of Deliverance|Fire on the Frontlines|Fire Support|In Ashes|Hidden Fangs|Reclamation|A Thousand Troops|Traitor|All Quiet on the Front|News of Victory|Return Home`,
`Ashes of Treachery|Trust Lost|Bared Fang|Rekindled Hope|Podium of Resolve|Shadows Over Pailune|Driving out the Shadows|Lurking Wolves|Reclamation|Lonely Jackals|Resolution|The Counterattack|Unleashed Fury|The Final Bridge|Broken Claws|Battle at Silverwolf Mountain|Incomplete Victory|Ludvig’s Whereabouts|Time to Face Justice`,
`Healing Pailune|A Bond|Ritual Preparations|Where the Wind Guides You|Chasing a Shadow|Blazing Fire|Whispering Shadows|Bloodied Invitation|Resolve Amidst a Storm|Preparations for Advance|Rebel Suppression|The Cursed Knight|The Blood Coronation|Clue|A Fleeting Dream`,
`An Unknown Voice|Cloister of Enlightenment|Mark of the Scar|Shackles of Fate|Crossing Point|Unwavering Steps|Morning Fog|Jijeong Temple in Chaos|Path to Enlightenment|Path of the Disciple|True Strength|Face the Inner Self|Fragments of Darkness|Pursuit Beyond the Veil|Black Witch|The Cloister of Enlightenment|The Sage of the Desert|New Perspectives|Lust for Power`,
`Untouchable|The Gate of War|Master of the Ironworks|Hidden Ace|Clockwork Insect Clash|Beating Heart|Invaders from the East|Frozen Hearted Predator|Lingering Shadow`,

`Precise Execution|Deferred Advance|Departure of the Brave|Forbidden Gate|A Shadow in the Void|Blinding Darkness`,
`A New Beginning|Peace in Hernand|The Unyielding Shields|The Heart of Pywel|The Enduring Flame|Evolving City|The Desert’s Edge|New Horizons`
];

const sideQuestNames={
Hernand:`A Rumor Fueled by Greed|Alden's Request|Ambition in the Ruins|Annabella's Request|Berto's Request|Bran's Request|Breaking in the Grindstone|Bruna's Request|Contradiction|Dahlia's Request|Deduction and Revelation of the Culprit|Delkin's Request|Empty Donation Box|Extinguishing the Last Flames|For a Stronger Shield|For Whom the Bell Tolls|Goddess of Abundance|Grania's Request|Gratitude Not Forgotten|Homeward|Invention of the Workshop|Legendary Wolf|Lunchbox of Love|Material of Light|Nork's Request|Path that Connects to House of Healing|Prox's Request|Refined Power|Renee's Request|Rhett's Request|Safety First (Hernandian Residents)|Savior of the Battlefield|Scent That Soothes the Night|Search for Leads|Seed of Truth|Serge's Request|Sigil of Solidarity (Mount-System)|Steps of the Waves|Stolen Supplies|Sturdy Horse|Tales of the Calphadean Merchants|The Bandits' Trap|The Cause of the Stench|The Hidden Space of the Heart|The Price of Coin`,
Pailune:`White Bear|Snowwhite Deer|Harry's Request|Lola's Request|Gunter's Request`
};

function slug(s){
return s.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"");
}

const originalIds=[
"unfamiliar-lands","in-ashes","realm-of-uncertainty","new-journey",
"where-rumors-gather","mysterious-man","true-wisdom","actions-speak",
"heart-beyond","mystical-key","polar-opposites","abyss-without-balance",
"woman-in-white"
];

const quests=[];

mainQuestNames.forEach((chapterText,chapter)=>{
chapterText.split("|").forEach((name,index)=>{
let id;
if(chapter===0||chapter===1){
id=originalIds[chapter===0?index:index+4];
}else if(chapter===2&&index<4){
id=slug(name);
}else{
id="c"+chapter+"-"+slug(name);
}
quests.push({id,name,chapter,type:"main"});
});
});

Object.entries(sideQuestNames).forEach(([region,names])=>{
names.split("|").forEach((name,index)=>{
quests.push({
id:"side-"+region.toLowerCase()+"-"+(index+1),
name,chapter:region,type:"side"
});
});
});

/*
 Vorhandene Kurzlösungen aus den bisherigen Versionen.
 Sie sind noch keine vollständigen Komplettlösungen.
*/

const solutions={
"where-rumors-gather":[
["Begib dich nach Hernand und suche die Taverne auf.","Travel to Hernand and visit the tavern."],
["Sprich mit den Soldaten und nimm die Herausforderung zum Armdrücken an.","Talk to the soldiers and accept the arm-wrestling challenge."],
["Folge den eingeblendeten Tastenhinweisen.","Follow the on-screen prompts."]
],
"mysterious-man":[
["Verlasse die Taverne und suche den älteren Bettler.","Leave the tavern and find the elderly beggar."],
["Sprich mit ihm und gib ihm eine Münze.","Talk to him and give him a coin."],
["Nimm den hölzernen Schlüssel entgegen.","Receive the wooden key."]
],
"where-the-light-leads":[
["Folge dem Licht des Shai-Anhängers zum Lioncrest-Wachturm außerhalb von Hernand.","Follow the light from the Shai pendant to Lioncrest Watchtower outside Hernand."],
["Besiege die Banditen und steige auf den Wachturm.","Defeat the bandits and climb the watchtower."],
["Untersuche den auffälligen Helm.","Inspect the unusual helmet."]
],
"memory-fragment":[
["Nimm den Helm aus dem Wachturm auf und rüste ihn aus.","Collect and equip the helmet from the watchtower."],
["Nutze die Erinnerungsfunktion und sieh die gespeicherte Erinnerung an.","Use the memory ability to view the stored memory."]
],
"reunion":[
["Folge dem Questziel zum Kind.","Follow the quest objective to the child."],
["Lerne die vorgeführten Fähigkeiten Nature’s Grasp und Focus.","Learn the demonstrated abilities Nature’s Grasp and Focus."]
],
"for-honor":[
["Suche in Hernand die Gruppe auf, die über die Greymanes spricht.","Find the group discussing the Greymanes in Hernand."],
["Stelle dich Matthias im Kampf.","Fight Matthias."]
]
};

quests.forEach(q=>{
if(solutions[q.id]){
q.steps=solutions[q.id].map(([de,en])=>({de,en}));
}
});

const sections=[
["home","⌂"],["map","🗺"],["quests","📜"],
["collection","⚔"],["progress","✓"],["settings","⚙"]
];

function readObject(key){
try{
const v=JSON.parse(localStorage.getItem(key)||"{}");
return v&&typeof v==="object"&&!Array.isArray(v)?v:{};
}catch{return {}}
}
function readArray(key){
try{
const v=JSON.parse(localStorage.getItem(key)||"[]");
return Array.isArray(v)?v:[];
}catch{return []}
}
function validPoint(p){
return p&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&
p.x>=0&&p.x<=100&&p.y>=0&&p.y<=100;
}
function readPoint(key){
const p=readObject(key);
return validPoint(p)?{x:p.x,y:p.y}:null;
}
function esc(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
})[c]);
}

let progress=readObject(PROGRESS_KEY);
const legacy=readObject("crimson-guide-progress-v1");

for(const q of quests){
if(legacy["quests:"+q.id]===true&&progress["quest:"+q.id]===undefined){
progress["quest:"+q.id]=true;
}
}

const types=["quest","boss","treasure","npc","material","other"];
let markers=readArray(MARKERS_KEY)
.filter(m=>validPoint(m)&&typeof m.name==="string")
.slice(0,500)
.map(m=>({
id:String(m.id||"m"+Math.random()),
name:m.name.slice(0,100),
type:types.includes(m.type)?m.type:"other",
x:m.x,y:m.y,completed:m.completed===true
}));

let player=readPoint(POSITION_KEY);
let target=readPoint(TARGET_KEY);
let language=localStorage.getItem("crimson-guide-language")==="en"?"en":"de";
let page="home";
let selectedQuest=null;
let solutionVisible=false;
let questQuery="";
let questChapter="all";
let questStatus="all";
let questType="all";
let collectionTab="items";
let mapMode="pan";
let zoom=1,offsetX=0,offsetY=0;

const t=k=>TXT[language][k]||k;
const mainCount=quests.filter(q=>q.type==="main").length;
const sideCount=quests.filter(q=>q.type==="side").length;

function chapterLabel(chapter){
if(typeof chapter==="string")return chapter;
if(chapter===0)return t("prologue");
if(chapter===13)return t("epilogue");
if(chapter===2)return language==="de"?"Kapitel 2 – Golden Greed":"Chapter 2 – Golden Greed";
return t("chapter")+" "+chapter;
}

function save(){
localStorage.setItem(PROGRESS_KEY,JSON.stringify(progress));
localStorage.setItem(MARKERS_KEY,JSON.stringify(markers));
if(player)localStorage.setItem(POSITION_KEY,JSON.stringify(player));
else localStorage.removeItem(POSITION_KEY);
if(target)localStorage.setItem(TARGET_KEY,JSON.stringify(target));
else localStorage.removeItem(TARGET_KEY);
}
function questDone(id){return progress["quest:"+id]===true}
function stepDone(id,i){return progress["step:"+id+":"+i]===true}
function doneCount(){return quests.filter(q=>questDone(q.id)).length}
function meter(n,total){
return `<div class="meter"><div style="width:${total?100*n/total:0}%"></div></div>`;
}
function navigate(next){
page=next;selectedQuest=null;solutionVisible=false;mapMode="pan";
render();window.scrollTo(0,0);
}
function renderNav(){
document.getElementById("nav").innerHTML=sections.map(([id,icon])=>
`<button data-go="${id}" class="${page===id?"active":""}">${icon} ${t(id)}</button>`
).join("");
document.getElementById("mobileNav").innerHTML=sections.slice(0,5).map(([id,icon])=>
`<button data-go="${id}" class="${page===id?"active":""}">
<span class="ico">${icon}</span><span>${t(id)}</span></button>`
).join("");
}

function homePage(){
return `
<div class="hero">
<div class="eyebrow">CRIMSON DESERT COMPANION • VERSION 4.0</div>
<h1>${t("welcome")}</h1>
<p>${t("intro")}</p>
<button class="btn gold" data-go="quests">📜 ${t("questDatabase")}</button>
</div>
<div class="grid">
<div class="card"><span class="small">${t("main")}</span>
<h1>${mainCount}</h1></div>
<div class="card"><span class="small">${t("side")}</span>
<h1>${sideCount}</h1></div>
</div>
<div class="card" style="margin-top:12px">
<div class="between"><strong>${t("progress")}</strong>
<span>${doneCount()} / ${quests.length}</span></div>
<div style="margin-top:12px">${meter(doneCount(),quests.length)}</div>
</div>
<div class="grid">
${sections.slice(1,5).map(([id,icon])=>`
<div class="card" data-go="${id}" style="cursor:pointer">
<h3>${icon} ${t(id)}</h3>
<p class="small">→</p>
</div>`).join("")}
</div>
<div class="notice">
${language==="de"
?"Hinweis: Die Questdatenbank ist umfangreich, aber die Komplettlösungen sind noch nicht vollständig."
:"Note: The quest database is extensive, but full walkthroughs are not yet complete."}
</div>`;
}

function questPage(){
if(selectedQuest){
const q=quests.find(x=>x.id===selectedQuest);
if(!q){selectedQuest=null;return questPage()}
const steps=q.steps||[];
return `
<button class="btn alt" id="backQuest">← ${t("back")}</button>
<h1>${esc(q.name)}</h1>
<p class="small">${esc(chapterLabel(q.chapter))} · ${t(q.type)}</p>
<div class="card">
<label><input type="checkbox" data-quest="${esc(q.id)}"
${questDone(q.id)?"checked":""}> ${t("finished")}</label>
</div>
<div>
<span class="questtag">${t("solutionStatus")}: ${steps.length?t("partial"):t("pending")}</span>
<span class="questtag">${steps.length} ${t("steps")}</span>
</div>
<button class="btn alt" id="toggleSolution" aria-expanded="${solutionVisible}">
${solutionVisible?t("hideSolution"):t("showSolution")}
</button>
${solutionVisible?`
<h2>${t("steps")}</h2>
${steps.length?steps.map((s,i)=>`
<label class="step">
<input type="checkbox" data-step="${esc(q.id)}:${i}"
${stepDone(q.id,i)?"checked":""}>
<span>${esc(s[language]||s.en)}</span>
</label>`).join(""):`<div class="empty">${t("noSteps")}</div>`}
`:`<div class="solutionhidden">🔒 ${t("showSolution")}</div>`}
${q.type==="main"?`
<p><a class="btn" href="${GUIDE_URL}" target="_blank"
rel="noopener noreferrer">${t("guide")} ↗</a></p>`:""}
`;
}

const found=quests.filter(q=>
(questChapter==="all"||String(q.chapter)===questChapter)&&
(questType==="all"||q.type===questType)&&
(questStatus==="all"||(questStatus==="done")===questDone(q.id))&&
q.name.toLowerCase().includes(questQuery.toLowerCase())
);

const chapters=[
...Array.from({length:14},(_,i)=>i),
"Hernand","Pailune"
];

return `
<h1>📜 ${t("questDatabase")}</h1>
<div class="grid">
<div class="card"><strong>${mainCount} ${t("main")}</strong></div>
<div class="card"><strong>${sideCount} ${t("side")}</strong></div>
</div>
<div class="toolbar">
<input id="questSearch" type="search"
placeholder="${t("questSearch")}" value="${esc(questQuery)}">
<select id="questType">
<option value="all">${t("allTypes")}</option>
<option value="main" ${questType==="main"?"selected":""}>${t("main")}</option>
<option value="side" ${questType==="side"?"selected":""}>${t("side")}</option>
</select>
<select id="questChapter">
<option value="all">${t("allChapters")}</option>
${chapters.map(c=>`
<option value="${c}" ${questChapter===String(c)?"selected":""}>
${esc(chapterLabel(c))}</option>`).join("")}
</select>
<select id="questStatus">
<option value="all">${t("allStatus")}</option>
<option value="open" ${questStatus==="open"?"selected":""}>${t("open")}</option>
<option value="done" ${questStatus==="done"?"selected":""}>${t("done")}</option>
</select>
</div>
<p class="small">${found.length} / ${quests.length}</p>
${found.length?found.map(q=>`
<div class="questrow">
<input type="checkbox" data-quest="${esc(q.id)}" ${questDone(q.id)?"checked":""}>
<button data-openquest="${esc(q.id)}">
<strong>${esc(q.name)}</strong>
<small>${esc(chapterLabel(q.chapter))} · ${t(q.type)} · ${q.steps?.length?t("partial"):t("pending")}</small>
</button><span>›</span>
</div>`).join(""):`<div class="empty">
${language==="de"?"Keine Quests gefunden":"No quests found"}
</div>`}`;
}

function iconFor(type){
return {quest:"📜",boss:"🐉",treasure:"💰",npc:"♟",material:"💎",other:"📍"}[type]||"📍";
}

function mapPage(){
const route=player&&target?`
<svg class="route" viewBox="0 0 100 100" preserveAspectRatio="none">
<line x1="${player.x}" y1="${player.y}" x2="${target.x}" y2="${target.y}"></line>
</svg>`:"";
return `
<div class="between">
<h1>🗺 ${t("map")}</h1>
<a class="btn alt smallbtn" href="${MAP_URL}" target="_blank"
rel="noopener noreferrer">↗ ${t("realMap")}</a>
</div>
<p class="small">${t("mapNote")}</p>
<div class="maptools">
<button class="btn ${mapMode==="player"?"":"alt"}" data-mode="player">🔵 ${t("setPlayer")}</button>
<button class="btn ${mapMode==="target"?"":"alt"}" data-mode="target">🎯 ${t("setTarget")}</button>
<button class="btn ${mapMode==="marker"?"":"alt"}" data-mode="marker">＋ ${t("addMarker")}</button>
</div>
${mapMode!=="pan"?`<div class="notice">Tippe auf die Karte / Tap the map</div>`:""}
<div class="mapwrap" id="mapwrap">
<div class="mapworld" id="mapworld">
<div class="mapcenter">✦ PYWEL<small>PLANNING CANVAS</small></div>
${route}
${markers.map(m=>`
<button class="mapmarker ${m.completed?"completed":""}"
style="left:${m.x}%;top:${m.y}%"
data-marker="${esc(m.id)}" title="${esc(m.name)}">${iconFor(m.type)}</button>`).join("")}
${player?`<span class="mapmarker player" style="left:${player.x}%;top:${player.y}%">●</span>`:""}
${target?`<span class="mapmarker target" style="left:${target.x}%;top:${target.y}%">★</span>`:""}
</div></div>
<div class="maptools">
<button class="btn alt" id="zoomIn">＋</button>
<button class="btn alt" id="zoomOut">－</button>
<button class="btn alt" id="resetView">${t("resetView")}</button>
</div>
<div class="notice">${t("mapWarning")}</div>
${player&&target?`<div class="card">
<strong>🧭 ${t("target")}</strong>
<p class="small">${t("navigationHint")}</p>
</div>`:""}
<div class="maptools">
${player?`<button class="btn alt smallbtn" id="clearPlayer">${t("removePlayer")}</button>`:""}
${target?`<button class="btn alt smallbtn" id="clearTarget">${t("removeTarget")}</button>`:""}
</div>
<h2>${t("markerList")} (${markers.length})</h2>
${markers.length?markers.map(m=>`
<div class="markerrow">
<span>${iconFor(m.type)}</span>
<div class="name"><strong>${esc(m.name)}</strong>
<small>${esc(m.type)} ${m.completed?"· ✓":""}</small></div>
<button class="btn alt smallbtn" data-targetmarker="${esc(m.id)}">🎯</button>
<button class="btn alt smallbtn" data-donemarker="${esc(m.id)}">${m.completed?"↩":"✓"}</button>
<button class="btn alt smallbtn" data-deletemarker="${esc(m.id)}">✕</button>
</div>`).join(""):`<div class="empty">${t("noMarkers")}</div>`}`;
}

function collectionPage(){
return `
<h1>⚔ ${t("collection")}</h1>
<p>${t("collectionInfo")}</p>
<div class="grid">
${[["items","⚔"],["bosses","🐉"],["npcs","♟"],["materials","💎"]]
.map(([id,icon])=>`
<button class="card" data-collection="${id}" style="text-align:left;color:white">
<h3>${icon} ${t(id)}</h3></button>`).join("")}
</div>
<div class="card" style="margin-top:15px">
<h2>${t(collectionTab)}</h2>
<div class="empty">${t("notReady")}</div>
</div>`;
}

function progressPage(){
const main=quests.filter(q=>q.type==="main");
const side=quests.filter(q=>q.type==="side");
return `
<h1>✓ ${t("progress")}</h1>
<div class="card">
<div class="between"><strong>${t("allQuests")}</strong>
<span>${doneCount()} / ${quests.length}</span></div>
<div style="margin-top:12px">${meter(doneCount(),quests.length)}</div>
</div>
${[["main",main],["side",side]].map(([label,qs])=>{
const n=qs.filter(q=>questDone(q.id)).length;
return `<div class="card">
<div class="between"><strong>${t(label)}</strong><span>${n} / ${qs.length}</span></div>
<div style="margin-top:12px">${meter(n,qs.length)}</div>
</div>`;
}).join("")}
<h2>${t("main")}</h2>
${Array.from({length:14},(_,c)=>{
const qs=quests.filter(q=>q.chapter===c);
const n=qs.filter(q=>questDone(q.id)).length;
return `<div class="card">
<div class="between"><strong>${chapterLabel(c)}</strong>
<span>${n} / ${qs.length}</span></div>
<div style="margin-top:12px">${meter(n,qs.length)}</div>
</div>`;
}).join("")}
<h2>${t("side")}</h2>
${["Hernand","Pailune"].map(region=>{
const qs=quests.filter(q=>q.chapter===region);
const n=qs.filter(q=>questDone(q.id)).length;
return `<div class="card">
<div class="between"><strong>${region}</strong>
<span>${n} / ${qs.length}</span></div>
<div style="margin-top:12px">${meter(n,qs.length)}</div>
</div>`;
}).join("")}
<div class="card"><strong>📍 ${t("markerCount")}</strong>
<p>${markers.length} ${t("total")}</p></div>`;

function settingsPage(){
return `
<h1>⚙ ${t("settings")}</h1>
<div class="card">
<p>${t("local")}</p>
<div class="toolbar">
<button class="btn" id="exportBtn">${t("export")}</button>
<button class="btn alt" id="importBtn">${t("import")}</button>
<button class="btn alt" id="resetBtn">${t("reset")}</button>
</div>
<input type="file" id="backupFile" accept=".json,application/json" hidden>
</div>
<div class="card">
<strong>Crimson Guide 4.0</strong>
<p class="small">PS5 Companion · DE / EN</p>
<p class="small">${mainCount} ${t("main")} · ${sideCount} ${t("side")}</p>
<p class="small">
${language==="de"
?"Die vollständigen Lösungen und weitere Nebenquests werden später ergänzt."
:"Full walkthroughs and more side quests will be added later."}
</p>
</div>`;
}

function render(){
document.documentElement.lang=language;
document.getElementById("lang").value=language;
renderNav();

document.getElementById("app").innerHTML=
page==="home"?homePage():
page==="map"?mapPage():
page==="quests"?questPage():
page==="collection"?collectionPage():
page==="progress"?progressPage():
settingsPage();

document.querySelectorAll("[data-go]").forEach(b=>
b.onclick=()=>navigate(b.dataset.go));

document.querySelectorAll("[data-quest]").forEach(b=>
b.onchange=()=>{
progress["quest:"+b.dataset.quest]=b.checked;
save();render();
});

document.querySelectorAll("[data-openquest]").forEach(b=>
b.onclick=()=>{
selectedQuest=b.dataset.openquest;
solutionVisible=false;
render();
window.scrollTo(0,0);
});

document.getElementById("backQuest")?.addEventListener("click",()=>{
selectedQuest=null;solutionVisible=false;render();
});

document.getElementById("toggleSolution")?.addEventListener("click",()=>{
solutionVisible=!solutionVisible;render();
});

document.querySelectorAll("[data-step]").forEach(b=>
b.onchange=()=>{
const [id,index]=b.dataset.step.split(":");
progress["step:"+id+":"+index]=b.checked;
save();render();
});

const search=document.getElementById("questSearch");
if(search)search.oninput=e=>{
questQuery=e.target.value;
const pos=e.target.selectionStart;
render();
const next=document.getElementById("questSearch");
next.focus();
next.setSelectionRange(pos,pos);
};

document.getElementById("questChapter")?.addEventListener("change",e=>{
questChapter=e.target.value;render();
});
document.getElementById("questType")?.addEventListener("change",e=>{
questType=e.target.value;render();
});
document.getElementById("questStatus")?.addEventListener("change",e=>{
questStatus=e.target.value;render();
});

document.querySelectorAll("[data-collection]").forEach(b=>
b.onclick=()=>{collectionTab=b.dataset.collection;render()});

if(page==="map")setupMap();
if(page==="settings")setupSettings();
}

function setupMap(){
const wrap=document.getElementById("mapwrap");
const world=document.getElementById("mapworld");

function transform(){
world.style.transform=`translate(${offsetX}px,${offsetY}px) scale(${zoom})`;
}

document.getElementById("zoomIn").onclick=()=>{
zoom=Math.min(4,zoom+.25);transform();
};
document.getElementById("zoomOut").onclick=()=>{
zoom=Math.max(.6,zoom-.25);transform();
};
document.getElementById("resetView").onclick=()=>{
zoom=1;offsetX=0;offsetY=0;transform();
};

document.querySelectorAll("[data-mode]").forEach(b=>
b.onclick=()=>{
mapMode=mapMode===b.dataset.mode?"pan":b.dataset.mode;
render();
});

document.getElementById("clearPlayer")?.addEventListener("click",()=>{
player=null;save();render();
});
document.getElementById("clearTarget")?.addEventListener("click",()=>{
target=null;save();render();
});

document.querySelectorAll("[data-targetmarker]").forEach(b=>
b.onclick=()=>{
const m=markers.find(x=>x.id===b.dataset.targetmarker);
if(m){target={x:m.x,y:m.y};save();render()}
});

document.querySelectorAll("[data-donemarker]").forEach(b=>
b.onclick=()=>{
const m=markers.find(x=>x.id===b.dataset.donemarker);
if(m){m.completed=!m.completed;save();render()}
});

document.querySelectorAll("[data-deletemarker]").forEach(b=>
b.onclick=()=>{
markers=markers.filter(m=>m.id!==b.dataset.deletemarker);
save();render();
});

document.querySelectorAll("[data-marker]").forEach(b=>
b.onclick=e=>{
e.stopPropagation();
const m=markers.find(x=>x.id===b.dataset.marker);
if(m)alert(m.name+" · "+m.type);
});

let dragging=false,moved=false,lastX=0,lastY=0,startX=0,startY=0;

wrap.addEventListener("pointerdown",e=>{
if(e.target.closest("button"))return;
dragging=true;moved=false;
startX=lastX=e.clientX;
startY=lastY=e.clientY;
wrap.setPointerCapture(e.pointerId);
});

wrap.addEventListener("pointermove",e=>{
if(!dragging)return;
if(Math.hypot(e.clientX-startX,e.clientY-startY)>7)moved=true;
if(mapMode==="pan"){
offsetX+=e.clientX-lastX;
offsetY+=e.clientY-lastY;
transform();
}
lastX=e.clientX;
lastY=e.clientY;
});

wrap.addEventListener("pointerup",e=>{
if(!dragging)return;
dragging=false;
if(moved||mapMode==="pan")return;

const rect=wrap.getBoundingClientRect();
const cx=rect.width/2,cy=rect.height/2;
const px=(e.clientX-rect.left-cx-offsetX)/zoom+cx;
const py=(e.clientY-rect.top-cy-offsetY)/zoom+cy;
const x=px/rect.width*100;
const y=py/rect.height*100;

if(x<0||x>100||y<0||y>100)return;

if(mapMode==="player"){
player={x,y};mapMode="pan";save();render();return;
}
if(mapMode==="target"){
target={x,y};mapMode="pan";save();render();return;
}
if(mapMode==="marker"){
const name=prompt(
language==="de"?"Name des Fundorts:":"Location name:"
);
if(!name?.trim())return;

const raw=prompt(
"Category: quest, boss, treasure, npc, material, other",
"other"
);
if(raw===null)return;

const type=types.includes(raw.trim().toLowerCase())
?raw.trim().toLowerCase():"other";

markers.push({
id:"m"+Date.now()+"-"+Math.random().toString(36).slice(2,8),
name:name.trim().slice(0,100),
type,x,y,completed:false
});

mapMode="pan";
save();
render();
}
});

wrap.addEventListener("pointercancel",()=>dragging=false);
transform();
}

function setupSettings(){
document.getElementById("exportBtn").onclick=()=>{
const backup={
version:31,
progress,
markers,
player,
target,
exportedAt:new Date().toISOString()
};
const blob=new Blob(
[JSON.stringify(backup,null,2)],
{type:"application/json"}
);
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="crimson-guide-backup.json";
a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
};

document.getElementById("importBtn").onclick=()=>{
document.getElementById("backupFile").click();
};

document.getElementById("backupFile").onchange=async e=>{
try{
const file=e.target.files[0];
if(!file)return;
if(file.size>1000000)throw Error("size");

const data=JSON.parse(await file.text());

if(![1,2,3,31].includes(data.version)||
!data.progress||
typeof data.progress!=="object"||
Array.isArray(data.progress)){
throw Error("format");
}

const clean={};

for(let [key,value] of Object.entries(data.progress)){
if(key.length>160||typeof value!=="boolean")continue;
if(data.version===1&&key.startsWith("quests:")){
key="quest:"+key.slice(7);
}
clean[key]=value;
}

progress=clean;

if(Array.isArray(data.markers)){
markers=data.markers
.filter(m=>validPoint(m)&&typeof m.name==="string")
.slice(0,500)
.map(m=>({
id:String(m.id||"m"+Math.random()).slice(0,100),
name:m.name.slice(0,100),
type:types.includes(m.type)?m.type:"other",
x:m.x,
y:m.y,
completed:m.completed===true
}));
}

if(data.version===31){
player=validPoint(data.player)?data.player:null;
target=validPoint(data.target)?data.target:null;
}

save();
alert(t("imported"));
render();

}catch{
alert(t("invalid"));
}
};

document.getElementById("resetBtn").onclick=()=>{
if(confirm(t("confirmReset"))){
progress={};
markers=[];
player=null;
target=null;
save();
render();
}
};
}

document.getElementById("lang").onchange=e=>{
language=e.target.value;
localStorage.setItem("crimson-guide-language",language);
render();
};

render();
</script>
</body>
</html>
