function slug(s){
return s.toLowerCase().normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function esc(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"

function readObject(key){
try{const v=JSON.parse(localStorage.getItem(key)||"{}");return v&&typeof v==="object"&&!Array.isArray(v)?v:{}}catch{return {}}
}
function readArray(key){
try{const v=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(v)?v:[]}catch{return []}
}
function validPoint(p){
return p&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&p.x>=0&&p.x<=100&&p.y>=0&&p.y<=100;
}
function readPoint(key){const p=readObject(key);return validPoint(p)?{x:p.x,y:p.y}:null}
let progress=readObject(PROGRESS_KEY);
let markers=readArray(MARKERS_KEY).filter(m=>validPoint(m)&&typeof m.name==="string").slice(0,500);
let player=readPoint(POSITION_KEY);
let target=readPoint(TARGET_KEY);
let language=localStorage.getItem("crimson-guide-language")==="en"?"en":"de";
let page="home",questView="chapters",activeGroup=null,selectedQuest=null;
let solutionVisible=false,questQuery="",questStatus="all",collectionTab="items";
let mapMode="pan",zoom=1,offsetX=0,offsetY=0;

["home","⌂"],["map","🗺"],["quests","📜"],
["collection","⚔"],["progress","✓"],["settings","⚙"]
];
const sideRegions=Object.keys(sideQuestNames);
const mainCount=quests.filter(q=>q.type==="main").length;
const sideCount=quests.filter(q=>q.type==="side").length;

function save(){
localStorage.setItem(PROGRESS_KEY,JSON.stringify(progress));
localStorage.setItem(MARKERS_KEY,JSON.stringify(markers));
if(player)localStorage.setItem(POSITION_KEY,JSON.stringify(player));
else localStorage.removeItem(POSITION_KEY);
if(target)localStorage.setItem(TARGET_KEY,JSON.stringify(target));
else localStorage.removeItem(TARGET_KEY);
}
function questDone(id){return progress["quest:"+id]===true}
function stepDone(id,i){return progress["step:"+id+":"+i]===true}
function doneCount(){return quests.filter(q=>questDone(q.id)).length}
function meter(n,total){
return `<div class="meter"><div style="width:${total?100*n/total:0}%"></div></div>`;
}
function chapterLabel(ch){
const c=typeof ch==="object"?ch.chapter:ch;
if(typeof c==="string")return c;
if(c===0)return language==="de"?"Prolog":"Prologue";
if(c===13)return language==="de"?"Epilog":"Epilogue";
return t("chapter")+" "+c;
}
function navigate(next){
page=next;selectedQuest=null;solutionVisible=false;
if(next==="quests"){
questView="chapters";activeGroup=null;questQuery="";questStatus="all";
}
mapMode="pan";render();window.scrollTo(0,0);
}

render();window.scrollTo(0,0);
});

b.onchange=()=>{
progress["quest:"+b.dataset.quest]=b.checked;

};
});

const raw=b.dataset.step;

save();render();
};
});

render();

next.focus();next.setSelectionRange(pos,pos);
};
document.getElementById("questStatus")?.addEventListener("change",e=>{
questStatus=e.target.value;render();
});
document.querySelectorAll("[data-collection]").forEach(b=>{

if(page==="map")setupMap();

function setupMap(){
const wrap=document.getElementById("mapwrap");
const world=document.getElementById("mapworld");
function transform(){
world.style.transform=`translate(${offsetX}px,${offsetY}px) scale(${zoom})`;
}
document.getElementById("zoomIn").onclick=()=>{
zoom=Math.min(4,zoom+.25);transform();
};
document.getElementById("zoomOut").onclick=()=>{
zoom=Math.max(.6,zoom-.25);transform();
};
document.getElementById("resetView").onclick=()=>{
zoom=1;offsetX=0;offsetY=0;transform();
};
document.querySelectorAll("[data-mode]").forEach(b=>{
b.onclick=()=>{
mapMode=mapMode===b.dataset.mode?"pan":b.dataset.mode;render();
};
});
document.getElementById("clearPlayer")?.addEventListener("click",()=>{
player=null;save();render();
});
document.getElementById("clearTarget")?.addEventListener("click",()=>{
target=null;save();render();
});
document.querySelectorAll("[data-targetmarker]").forEach(b=>{
b.onclick=()=>{
const m=markers.find(x=>String(x.id)===b.dataset.targetmarker);
if(m){target={x:m.x,y:m.y};save();render()}
};
});
document.querySelectorAll("[data-donemarker]").forEach(b=>{
b.onclick=()=>{
const m=markers.find(x=>String(x.id)===b.dataset.donemarker);
if(m){m.completed=!m.completed;save();render()}
};
});
document.querySelectorAll("[data-deletemarker]").forEach(b=>{
b.onclick=()=>{
markers=markers.filter(m=>String(m.id)!==b.dataset.deletemarker);
save();render();
};
});
document.querySelectorAll("[data-marker]").forEach(b=>{
b.onclick=e=>{
e.stopPropagation();
const m=markers.find(x=>String(x.id)===b.dataset.marker);
if(m)alert(m.name+" · "+m.type);
};
});
let dragging=false,moved=false,lastX=0,lastY=0,startX=0,startY=0;
wrap.addEventListener("pointerdown",e=>{
if(e.target.closest("button"))return;
dragging=true;moved=false;
startX=lastX=e.clientX;startY=lastY=e.clientY;
wrap.setPointerCapture(e.pointerId);
});
wrap.addEventListener("pointermove",e=>{
if(!dragging)return;
if(Math.hypot(e.clientX-startX,e.clientY-startY)>7)moved=true;
if(mapMode==="pan"){
offsetX+=e.clientX-lastX;offsetY+=e.clientY-lastY;transform();
}
lastX=e.clientX;lastY=e.clientY;
});
wrap.addEventListener("pointerup",e=>{
if(!dragging)return;
dragging=false;
if(moved||mapMode==="pan")return;
const rect=wrap.getBoundingClientRect();
const cx=rect.width/2,cy=rect.height/2;
const px=(e.clientX-rect.left-cx-offsetX)/zoom+cx;
const py=(e.clientY-rect.top-cy-offsetY)/zoom+cy;
const x=px/rect.width*100,y=py/rect.height*100;
if(x<0||x>100||y<0||y>100)return;
if(mapMode==="player"){
player={x,y};mapMode="pan";save();render();return;
}
if(mapMode==="target"){
target={x,y};mapMode="pan";save();render();return;
}
if(mapMode==="marker"){
const name=prompt(language==="de"?"Name des Fundorts:":"Location name:");
if(!name?.trim())return;
const raw=prompt("Category: quest, boss, treasure, npc, material, other","other");
if(raw===null)return;
const types=["quest","boss","treasure","npc","material","other"];
const type=types.includes(raw.trim().toLowerCase())?raw.trim().toLowerCase():"other";
markers.push({
id:"m"+Date.now()+"-"+Math.random().toString(36).slice(2,8),
name:name.trim().slice(0,100),type,x,y,completed:false
});
mapMode="pan";save();render();
}
});
wrap.addEventListener("pointercancel",()=>{dragging=false});
transform();
}
function setupSettings(){
document.getElementById("exportBtn").onclick=()=>{
const backup={
version:31,progress,markers,player,target,
exportedAt:new Date().toISOString()
};
const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;a.download="crimson-guide-backup.json";a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
};
document.getElementById("importBtn").onclick=()=>{
document.getElementById("backupFile").click();
};
document.getElementById("backupFile").onchange=async e=>{
try{
const file=e.target.files[0];if(!file)return;
if(file.size>1000000)throw Error("size");
const data=JSON.parse(await file.text());
if(![1,2,3,31].includes(data.version)||!data.progress||
typeof data.progress!=="object"||Array.isArray(data.progress)){
throw Error("format");
}
const clean={};
for(let [key,value] of Object.entries(data.progress)){
if(key.length>160||typeof value!=="boolean")continue;
if(data.version===1&&key.startsWith("quests:"))key="quest:"+key.slice(7);
clean[key]=value;
}
progress=clean;
if(Array.isArray(data.markers)){
markers=data.markers.filter(m=>validPoint(m)&&typeof m.name==="string")
.slice(0,500).map(m=>({
id:String(m.id||"m"+Math.random()).slice(0,100),
name:m.name.slice(0,100),
type:["quest","boss","treasure","npc","material","other"].includes(m.type)?m.type:"other",
x:m.x,y:m.y,completed:m.completed===true
}));
}
if(data.version===31){
player=validPoint(data.player)?data.player:null;
target=validPoint(data.target)?data.target:null;
}
save();alert(t("imported"));render();
}catch{alert(t("invalid"))}
};
document.getElementById("resetBtn").onclick=()=>{
if(confirm(t("confirmReset"))){
progress={};markers=[];player=null;target=null;save();render();
}
};
}
document.getElementById("lang").onchange=e=>{
language=e.target.value;
localStorage.setItem("crimson-guide-language",language);
render();
};
render();
if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("./sw.js").catch(()=>{});
});
}
</script>
