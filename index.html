
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crimson Guide">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Crimson Guide 3.1</title>

<style>
:root{
--bg:#101116;
--panel:#1c1e26;
--panel2:#282b35;
--line:#373943;
--text:#f6f2ec;
--muted:#aaaab5;
--gold:#e0b979;
--red:#af424c;
--green:#78c9a2;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:system-ui,-apple-system,sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,
input:focus-visible,
select:focus-visible{
outline:2px solid var(--gold);
outline-offset:2px;
}
a{color:var(--gold)}
.layout{display:flex;min-height:100dvh}
aside{
width:220px;
flex-shrink:0;
background:#171920;
border-right:1px solid var(--line);
padding:20px 12px;
}
.brand{
font-size:21px;
font-weight:900;
color:var(--gold);
padding:12px;
}
.brand small{
display:block;
font-size:10px;
letter-spacing:2px;
color:var(--muted);
margin-top:5px;
}
nav{display:grid;gap:5px;margin-top:20px}
nav button{
border:0;
background:none;
color:var(--muted);
padding:13px;
border-radius:10px;
text-align:left;
}
nav button.active{
background:#4a292e;
color:white;
}
main{
width:100%;
max-width:1250px;
min-width:0;
margin:auto;
padding:22px;
align-self:flex-start;
}
header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:22px;
}
.eyebrow{
font-size:11px;
letter-spacing:2px;
color:var(--gold);
}
h1{
font-size:clamp(27px,4vw,39px);
margin:8px 0 15px;
}
h2{font-size:20px}
h3{font-size:16px}
p{color:var(--muted);line-height:1.55}
.small{font-size:13px;color:var(--muted)}
.card{
background:var(--panel);
border:1px solid var(--line);
border-radius:14px;
padding:17px;
margin-bottom:12px;
}
.hero{
background:linear-gradient(125deg,#542b32,#1c1e26);
border:1px solid #77444b;
padding:26px;
border-radius:16px;
margin-bottom:15px;
}
.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}
.grid .card{margin:0}
.btn{
display:inline-flex;
justify-content:center;
align-items:center;
gap:7px;
background:var(--red);
color:white;
border:0;
border-radius:10px;
padding:11px 15px;
font-weight:650;
text-decoration:none;
}
.btn.alt{background:#30343e}
.btn.gold{background:var(--gold);color:#171515}
.btn.active{background:#6c444a}
.btn.smallbtn{padding:8px 11px;font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
input[type=search],input[type=text],select{
background:var(--panel2);
border:1px solid var(--line);
color:white;
border-radius:10px;
padding:11px;
min-width:0;
}
input[type=search]{flex:1;min-width:140px}
input[type=checkbox]{
accent-color:var(--red);
width:17px;
height:17px;
}
.between{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}
.meter{
height:9px;
background:#373943;
border-radius:20px;
overflow:hidden;
}
.meter div{
height:100%;
background:var(--red);
}
.questrow{
display:flex;
align-items:center;
gap:12px;
padding:13px;
background:var(--panel);
border:1px solid var(--line);
border-radius:11px;
margin-bottom:8px;
}
.questrow button{
flex:1;
min-width:0;
background:none;
border:0;
color:white;
text-align:left;
}
.questrow button strong{display:block}
.questrow button small{
display:block;
color:var(--muted);
margin-top:4px;
}
.step{
display:flex;
gap:10px;
align-items:flex-start;
background:var(--panel2);
border-radius:10px;
padding:13px;
margin-bottom:8px;
}
.step span{line-height:1.5}
.notice{
padding:12px;
background:#2c281f;
border-left:3px solid var(--gold);
color:#e7d5b5;
font-size:13px;
margin:12px 0;
}
.empty{
border:1px dashed var(--line);
border-radius:12px;
padding:26px;
text-align:center;
color:var(--muted);
}
.chips{
display:flex;
gap:7px;
overflow-x:auto;
padding:4px 0 12px;
scrollbar-width:thin;
}
.chip{
white-space:nowrap;
background:var(--panel);
border:1px solid var(--line);
color:var(--muted);
border-radius:30px;
padding:9px 13px;
}
.chip.active{
background:#65383f;
color:white;
border-color:#9e5860;
}
.maptools{
display:flex;
flex-wrap:wrap;
gap:8px;
margin:12px 0;
}
.mapwrap{
position:relative;
height:min(65vh,620px);
min-height:350px;
border-radius:15px;
border:1px solid var(--line);
overflow:hidden;
background:#242a31;
touch-action:none;
cursor:grab;
}
.mapwrap:active{cursor:grabbing}
.mapworld{
position:absolute;
inset:0;
transform-origin:center;
background:
radial-gradient(ellipse at 35% 35%,#48574a,transparent 48%),
radial-gradient(ellipse at 72% 68%,#535063,transparent 49%),
repeating-linear-gradient(0deg,transparent 0 49px,#ffffff0a 50px),
repeating-linear-gradient(90deg,transparent 0 49px,#ffffff0a 50px),
#28323a;
}
.mapcenter{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
color:#dbc398;
pointer-events:none;
font-size:23px;
letter-spacing:2px;
opacity:.8;
}
.mapcenter small{
display:block;
font-size:10px;
letter-spacing:1px;
margin-top:8px;
}
.mapmarker{
position:absolute;
transform:translate(-50%,-50%);
width:34px;
height:34px;
border-radius:50%;
border:2px solid #fff3d8;
background:#a8424b;
color:white;
display:grid;
place-items:center;
font-size:17px;
z-index:4;
}
.mapmarker.player{
background:#1b86dc;
box-shadow:0 0 0 5px #1b86dc33;
}
.mapmarker.target{
background:#c18c2b;
box-shadow:0 0 0 5px #c18c2b33;
}
.mapmarker.completed{opacity:.55}
.route{
position:absolute;
inset:0;
width:100%;
height:100%;
pointer-events:none;
z-index:2;
}
.route line{
stroke:#f4d084;
stroke-width:.7;
stroke-dasharray:1.5 1;
vector-effect:non-scaling-stroke;
}
.maplegend{
display:flex;
flex-wrap:wrap;
gap:12px;
font-size:12px;
color:var(--muted);
margin:10px 0;
}
.maplegend b{color:var(--text)}
.markerrow{
display:flex;
align-items:center;
gap:10px;
padding:12px;
background:var(--panel);
border:1px solid var(--line);
border-radius:10px;
margin-bottom:7px;
}
.markerrow .name{flex:1;min-width:0}
.markerrow strong{display:block}
.markerrow small{color:var(--muted)}
.mapfullscreen{
position:fixed!important;
inset:0!important;
z-index:100!important;
height:100dvh!important;
border-radius:0!important;
}
.fullscreenExit{
position:absolute;
right:12px;
top:12px;
z-index:20;
display:none;
}
.mapfullscreen .fullscreenExit{display:block}
.mobileNav{display:none}
footer{
font-size:11px;
color:var(--muted);
margin-top:35px;
}
@media(max-width:760px){
.layout{display:block}
aside{display:none}
main{padding:15px 13px 105px}
header{margin-bottom:15px}
.hero{padding:20px}
.grid{gap:9px}
.grid .card{padding:13px}
.mapwrap{height:53dvh;min-height:320px}
.mobileNav{
position:fixed;
bottom:0;
left:0;
right:0;
z-index:50;
display:flex;
justify-content:space-around;
background:#191b22;
border-top:1px solid var(--line);
padding:7px 3px calc(7px + env(safe-area-inset-bottom));
}
.mobileNav button{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
border:0;
background:none;
color:var(--muted);
padding:7px 2px;
font-size:10px;
}
.mobileNav button.active{color:var(--gold)}
.mobileNav .ico{font-size:22px}
}
</style>
</head>

<body>
<div class="layout">
<aside>
<div class="brand">
⚔ CRIMSON GUIDE
<small>PYWEL COMPANION</small>
</div>
<nav id="nav"></nav>
</aside>

<main>
<header>
<span class="eyebrow">CRIMSON GUIDE • 3.1A</span>
<select id="lang" aria-label="Language">
<option value="de">🇩🇪 Deutsch</option>
<option value="en">🇬🇧 English</option>
</select>
</header>

<div id="app"></div>

<footer>
Unofficial fan project. Not affiliated with Pearl Abyss.
</footer>
</main>
</div>

<div id="mobileNav" class="mobileNav"></div>

<script>
"use strict";

const MAP_URL =
"https://crimsondesert.th.gl/maps/Continent%20of%20Pywel";

const GUIDE_URL =
"https://www.powerpyx.com/crimson-desert-walkthrough-all-main-quests/";

const PROGRESS_KEY="crimson-guide-progress-v2";
const MARKERS_KEY="crimson-guide-markers-v3";
const POSITION_KEY="crimson-guide-player-v31";
const TARGET_KEY="crimson-guide-target-v31";

const TXT={
de:{
home:"Start",map:"Karte",quests:"Quests",
collection:"Sammlung",progress:"Fortschritt",
settings:"Einstellungen",
welcome:"Dein Abenteuer in Pywel",
intro:"Deine Karte, deine Quests, dein Fortschritt.",
realMap:"Vollständige Pywel-Karte öffnen",
mapTitle:"Meine Abenteuerkarte",
mapNote:"Eigene Planungsfläche. Noch keine echte Pywel-Karte.",
mapWarning:"Die Positionen auf dieser Planungsfläche entsprechen noch keinen echten Spielkoordinaten.",
search:"Markierungen suchen...",
all:"Alle",quest:"Quest",boss:"Boss",
treasure:"Schatz",npc:"NPC",
material:"Material",other:"Sonstiges",
setPlayer:"Spielerposition setzen",
setTarget:"Ziel setzen",
addMarker:"Marker hinzufügen",
cancel:"Abbrechen",
fullscreen:"Vollbild",
exitFullscreen:"Vollbild schließen",
resetView:"Ansicht zurücksetzen",
position:"Spielerposition",
target:"Zielpunkt",
route:"Ziellinie",
noTarget:"Noch kein Ziel gewählt",
tapMap:"Tippe jetzt auf die Karte.",
markerName:"Name des Fundorts:",
markerType:"Kategorie eingeben (quest, boss, treasure, npc, material, other):",
markerSaved:"Markierung gespeichert.",
markerList:"Meine Fundorte",
noMarkers:"Noch keine Markierungen vorhanden.",
chooseTarget:"Als Ziel",
markDone:"Erledigt",
delete:"Löschen",
removeTarget:"Ziel entfernen",
removePlayer:"Position entfernen",
chap0:"Prolog",chap1:"Kapitel 1",
allChapters:"Alle Kapitel",
allStatus:"Alle Status",
open:"Offen",done:"Erledigt",
questSearch:"Quest suchen...",
steps:"Lösungsschritte",
noSteps:"Noch keine geprüfte Schritt-für-Schritt-Lösung vorhanden.",
guide:"Externen Quest-Guide öffnen",
finished:"Quest abgeschlossen",
back:"Zurück",
collectionInfo:"Hier entstehen später die vollständigen Datenbanken.",
items:"Gegenstände",bosses:"Bosse",
npcs:"NPCs",materials:"Materialien",
notReady:"Noch keine geprüften Inhalte vorhanden.",
local:"Deine Daten bleiben lokal auf diesem Gerät. Erstelle regelmäßig ein Backup.",
export:"Backup exportieren",
import:"Backup importieren",
reset:"Alle Daten löschen",
confirmReset:"Wirklich Fortschritt und Markierungen löschen?",
invalid:"Ungültige Backup-Datei.",
imported:"Backup importiert.",
total:"Gesamt",
markerCount:"Markierungen",
distance:"Abstand auf Planungsfläche",
navigationHint:"Die Linie zeigt nur die direkte Richtung auf der Planungsfläche, keinen begehbaren Spielweg.",
clear:"Zurücksetzen"
},
en:{
home:"Home",map:"Map",quests:"Quests",
collection:"Collection",progress:"Progress",
settings:"Settings",
welcome:"Your adventure in Pywel",
intro:"Your map, quests and progress.",
realMap:"Open complete Pywel map",
mapTitle:"My Adventure Map",
mapNote:"Personal planning canvas. Not a real Pywel map yet.",
mapWarning:"Positions on this planning canvas do not represent actual game coordinates.",
search:"Search markers...",
all:"All",quest:"Quest",boss:"Boss",
treasure:"Treasure",npc:"NPC",
material:"Material",other:"Other",
setPlayer:"Set player position",
setTarget:"Set destination",
addMarker:"Add marker",
cancel:"Cancel",
fullscreen:"Fullscreen",
exitFullscreen:"Exit fullscreen",
resetView:"Reset view",
position:"Player position",
target:"Destination",
route:"Destination line",
noTarget:"No destination selected",
tapMap:"Tap the map now.",
markerName:"Location name:",
markerType:"Enter category (quest, boss, treasure, npc, material, other):",
markerSaved:"Marker saved.",
markerList:"My locations",
noMarkers:"No markers yet.",
chooseTarget:"Set target",
markDone:"Completed",
delete:"Delete",
removeTarget:"Clear destination",
removePlayer:"Clear position",
chap0:"Prologue",chap1:"Chapter 1",
allChapters:"All chapters",
allStatus:"All statuses",
open:"Open",done:"Completed",
questSearch:"Search quests...",
steps:"Walkthrough steps",
noSteps:"No verified step-by-step walkthrough yet.",
guide:"Open external quest guide",
finished:"Quest completed",
back:"Back",
collectionInfo:"Complete databases will be added later.",
items:"Items",bosses:"Bosses",
npcs:"NPCs",materials:"Materials",
notReady:"No verified content available yet.",
local:"Data stays on this device. Export backups regularly.",
export:"Export backup",
import:"Import backup",
reset:"Delete all data",
confirmReset:"Delete progress and markers?",
invalid:"Invalid backup file.",
imported:"Backup imported.",
total:"Total",
markerCount:"Markers",
distance:"Planning canvas distance",
navigationHint:"The line only shows direction on the planning canvas, not a traversable game route.",
clear:"Reset"
}
};

const quests=[
{id:"unfamiliar-lands",name:"Unfamiliar Lands",chapter:0},
{id:"in-ashes",name:"In Ashes",chapter:0},
{id:"realm-of-uncertainty",name:"Realm of Uncertainty",chapter:0},
{id:"new-journey",name:"New Journey",chapter:0},
{id:"where-rumors-gather",name:"Where Rumors Gather",chapter:1,
steps:[
{de:"Begib dich nach Hernand und suche die Taverne auf.",
en:"Travel to Hernand and visit the tavern."},
{de:"Sprich mit den Soldaten und nimm die Herausforderung zum Armdrücken an.",
en:"Talk to the soldiers and accept the arm-wrestling challenge."},
{de:"Folge den eingeblendeten Tastenhinweisen.",
en:"Follow the on-screen prompts."}
]},
{id:"mysterious-man",name:"Mysterious Man",chapter:1,
steps:[
{de:"Verlasse die Taverne und suche den älteren Bettler.",
en:"Leave the tavern and find the elderly beggar."},
{de:"Sprich mit ihm und gib ihm eine Münze.",
en:"Talk to him and give him a coin."},
{de:"Nimm den hölzernen Schlüssel entgegen.",
en:"Receive the wooden key."}
]},
{id:"true-wisdom",name:"True Wisdom in Kindness",chapter:1},
{id:"actions-speak",name:"Actions Speak Louder than Words",chapter:1},
{id:"heart-beyond",name:"Heart Beyond Borders",chapter:1},
{id:"mystical-key",name:"Mystical Key",chapter:1},
{id:"polar-opposites",name:"Polar Opposites",chapter:1},
{id:"abyss-without-balance",name:"Abyss Without Balance",chapter:1},
{id:"woman-in-white",name:"Woman in White",chapter:1}
];

const sections=[
["home","⌂"],
["map","🗺"],
["quests","📜"],
["collection","⚔"],
["progress","✓"],
["settings","⚙"]
];

function readObject(key){
try{
const x=JSON.parse(localStorage.getItem(key)||"{}");
return x&&typeof x==="object"&&!Array.isArray(x)?x:{};
}catch{return {}}
}
function readArray(key){
try{
const x=JSON.parse(localStorage.getItem(key)||"[]");
return Array.isArray(x)?x:[];
}catch{return []}
}
function validPoint(p){
return p&&
Number.isFinite(p.x)&&
Number.isFinite(p.y)&&
p.x>=0&&p.x<=100&&
p.y>=0&&p.y<=100;
}
function readPoint(key){
const x=readObject(key);
return validPoint(x)?{x:x.x,y:x.y}:null;
}

let progress=readObject(PROGRESS_KEY);
const legacy=readObject("crimson-guide-progress-v1");

for(const q of quests){
if(legacy["quests:"+q.id]===true &&
progress["quest:"+q.id]===undefined){
progress["quest:"+q.id]=true;
}
}
localStorage.setItem(PROGRESS_KEY,JSON.stringify(progress));

const types=["quest","boss","treasure","npc","material","other"];

let markers=readArray(MARKERS_KEY)
.filter(m=>validPoint(m)&&typeof m.name==="string")
.slice(0,500)
.map(m=>({
id:String(m.id||crypto.randomUUID()),
name:m.name.slice(0,100),
type:types.includes(m.type)?m.type:"other",
x:m.x,y:m.y,
completed:m.completed===true
}));

let player=readPoint(POSITION_KEY);
let target=readPoint(TARGET_KEY);

let language=localStorage.getItem("crimson-guide-language")==="en"
?"en":"de";

let page="map";
let questQuery="";
let questChapter="all";
let questStatus="all";
let selectedQuest=null;
let collectionTab="items";

let mapQuery="";
let markerFilter="all";
let hideCompleted=false;
let mapMode="pan";
let fullscreen=false;

let zoom=1;
let offsetX=0;
let offsetY=0;

const t=k=>TXT[language][k]||k;

function esc(v){
return String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

function save(){
localStorage.setItem(PROGRESS_KEY,JSON.stringify(progress));
localStorage.setItem(MARKERS_KEY,JSON.stringify(markers));
if(player)localStorage.setItem(POSITION_KEY,JSON.stringify(player));
else localStorage.removeItem(POSITION_KEY);
if(target)localStorage.setItem(TARGET_KEY,JSON.stringify(target));
else localStorage.removeItem(TARGET_KEY);
}

function questDone(id){
return progress["quest:"+id]===true;
}
function stepDone(id,i){
return progress["step:"+id+":"+i]===true;
}
function doneCount(){
return quests.filter(q=>questDone(q.id)).length;
}
function meter(n,total){
return `<div class="meter"><div style="width:${total?100*n/total:0}%"></div></div>`;
}

function navigate(p){
page=p;
selectedQuest=null;
fullscreen=false;
mapMode="pan";
render();
window.scrollTo(0,0);
}

function renderNav(){
document.getElementById("nav").innerHTML=
sections.map(([id,icon])=>`
<button data-go="${id}" class="${page===id?"active":""}">
${icon} ${t(id)}
</button>`).join("");

document.getElementById("mobileNav").innerHTML=
sections.slice(0,5).map(([id,icon])=>`
<button data-go="${id}" class="${page===id?"active":""}">
<span class="ico">${icon}</span>
<span>${t(id)}</span>
</button>`).join("");
}

function homePage(){
return `
<div class="hero">
<div class="eyebrow">CRIMSON DESERT COMPANION</div>
<h1>${t("welcome")}</h1>
<p>${t("intro")}</p>
<button class="btn gold" data-go="map">🗺 ${t("map")}</button>
</div>
<div class="card">
<div class="between">
<strong>${t("progress")}</strong>
<span>${doneCount()} / ${quests.length}</span>
</div>
<div style="margin-top:12px">${meter(doneCount(),quests.length)}</div>
</div>
<div class="grid">
${sections.slice(1,5).map(([id,icon])=>`
<div class="card" data-go="${id}" style="cursor:pointer">
<h3>${icon} ${t(id)}</h3>
<p class="small">${id==="map"?markers.length+" "+t("markerCount"):"→"}</p>
</div>`).join("")}
</div>`;
}

function iconFor(type){
return ({
quest:"📜",boss:"🐉",treasure:"💰",
npc:"♟",material:"💎",other:"📍"
})[type]||"📍";
}

function filteredMarkers(){
return markers.filter(m=>
(markerFilter==="all"||m.type===markerFilter)&&
(!hideCompleted||!m.completed)&&
m.name.toLowerCase().includes(mapQuery.toLowerCase())
);
}

function routeSVG(){
if(!player||!target)return "";
return `
<svg class="route" viewBox="0 0 100 100" preserveAspectRatio="none">
<line x1="${player.x}" y1="${player.y}"
x2="${target.x}" y2="${target.y}"></line>
</svg>`;
}

function mapPage(){
const shown=filteredMarkers();
const cats=["all",...types];

const dist=player&&target
?Math.hypot(target.x-player.x,target.y-player.y).toFixed(1)
:null;

return `
<div class="between">
<h1 style="margin-bottom:8px">🗺 ${t("map")}</h1>
<a class="btn alt smallbtn" href="${MAP_URL}"
target="_blank" rel="noopener noreferrer">↗ ${t("realMap")}</a>
</div>

<div class="toolbar">
<input id="mapSearch" type="search"
placeholder="${t("search")}" value="${esc(mapQuery)}">
</div>

<div class="chips">
${cats.map(type=>`
<button class="chip ${markerFilter===type?"active":""}"
data-filter="${type}">
${type==="all"?"🌍":iconFor(type)} ${t(type)}
</button>`).join("")}
</div>

<div class="maptools">
<button class="btn ${mapMode==="player"?"active":"alt"}"
data-mode="player">🔵 ${t("setPlayer")}</button>
<button class="btn ${mapMode==="target"?"active":"alt"}"
data-mode="target">🎯 ${t("setTarget")}</button>
<button class="btn ${mapMode==="marker"?"active":"alt"}"
data-mode="marker">＋ ${t("addMarker")}</button>
<button class="btn alt" id="fullBtn">⛶ ${t("fullscreen")}</button>
</div>

${mapMode!=="pan"
?`<div class="notice">${t("tapMap")}</div>`
:`<p class="small">${t("mapNote")}</p>`}

<div class="mapwrap ${fullscreen?"mapfullscreen":""}" id="mapwrap">

function questPage(){
if(selectedQuest){
const q=quests.find(x=>x.id===selectedQuest);
if(!q){selectedQuest=null;return questPage()}
return `
<button class="btn alt" id="backQuest">← ${t("back")}</button>
<h1>${esc(q.name)}</h1>
<p class="small">${t("chap"+q.chapter)}</p>
<div class="card">
<label>
<input type="checkbox" data-quest="${q.id}"
${questDone(q.id)?"checked":""}>
${t("finished")}
</label>
</div>
<h2>${t("steps")}</h2>
${q.steps?.length?q.steps.map((s,i)=>`
<label class="step">
<input type="checkbox" data-step="${q.id}:${i}"
${stepDone(q.id,i)?"checked":""}>
<span>${esc(s[language]||s.en)}</span>
</label>`).join("")
:`<div class="empty">${t("noSteps")}</div>`}
<p><a class="btn" href="${GUIDE_URL}"
target="_blank" rel="noopener noreferrer">
${t("guide")} ↗</a></p>`;
}

const found=quests.filter(q=>
(questChapter==="all"||String(q.chapter)===questChapter)&&
(questStatus==="all"||
(questStatus==="done")===questDone(q.id))&&
q.name.toLowerCase().includes(questQuery.toLowerCase())
);

return `
<h1>📜 ${t("quests")}</h1>
<div class="toolbar">
<input id="questSearch" type="search"
placeholder="${t("questSearch")}"
value="${esc(questQuery)}">
<select id="questChapter">
<option value="all">${t("allChapters")}</option>
<option value="0" ${questChapter==="0"?"selected":""}>${t("chap0")}</option>
<option value="1" ${questChapter==="1"?"selected":""}>${t("chap1")}</option>
</select>
<select id="questStatus">
<option value="all">${t("allStatus")}</option>
<option value="open" ${questStatus==="open"?"selected":""}>${t("open")}</option>
<option value="done" ${questStatus==="done"?"selected":""}>${t("done")}</option>
</select>
</div>
<p class="small">${found.length} / ${quests.length}</p>
${found.map(q=>`
<div class="questrow">
<input type="checkbox" data-quest="${q.id}"
${questDone(q.id)?"checked":""}>
<button data-openquest="${q.id}">
<strong>${esc(q.name)}</strong>
<small>${t("chap"+q.chapter)}</small>
</button>
<span>›</span>
</div>`).join("")}`;
}

function setupMap(){
const wrap=document.getElementById("mapwrap");
const world=document.getElementById("mapworld");

function transform(){
world.style.transform=
`translate(${offsetX}px,${offsetY}px) scale(${zoom})`;
}

document.getElementById("zoomIn").onclick=()=>{
zoom=Math.min(4,zoom+.25);
transform();
};
document.getElementById("zoomOut").onclick=()=>{
zoom=Math.max(.6,zoom-.25);
transform();
};
document.getElementById("resetView").onclick=()=>{
zoom=1;offsetX=0;offsetY=0;
transform();
};

document.querySelectorAll("[data-mode]").forEach(b=>
b.onclick=()=>{
mapMode=mapMode===b.dataset.mode?"pan":b.dataset.mode;
render();
}
);

document.querySelectorAll("[data-filter]").forEach(b=>
b.onclick=()=>{
markerFilter=b.dataset.filter;
render();
}
);

const search=document.getElementById("mapSearch");
search.oninput=e=>{
mapQuery=e.target.value;
const pos=e.target.selectionStart;
render();
const next=document.getElementById("mapSearch");
next.focus();
next.setSelectionRange(pos,pos);
};

document.getElementById("hideCompleted").onchange=e=>{
hideCompleted=e.target.checked;
render();
};

document.getElementById("fullBtn").onclick=()=>{
fullscreen=!fullscreen;
render();
};
document.getElementById("exitFull").onclick=()=>{
fullscreen=false;
render();
};

document.getElementById("clearPlayer")?.addEventListener("click",()=>{
player=null;save();render();
});
document.getElementById("clearTarget")?.addEventListener("click",()=>{
target=null;save();render();
});

document.querySelectorAll("[data-targetmarker]").forEach(b=>
b.onclick=()=>{
const m=markers.find(x=>x.id===b.dataset.targetmarker);
if(m){
target={x:m.x,y:m.y};
save();render();
}
}
);

document.querySelectorAll("[data-donemarker]").forEach(b=>
b.onclick=()=>{
const m=markers.find(x=>x.id===b.dataset.donemarker);
if(m){
m.completed=!m.completed;
save();render();
}
}
);

document.querySelectorAll("[data-deletemarker]").forEach(b=>
b.onclick=()=>{
const id=b.dataset.deletemarker;
markers=markers.filter(m=>m.id!==id);
save();render();
}
);

document.querySelectorAll("[data-marker]").forEach(b=>
b.onclick=e=>{
e.stopPropagation();
const m=markers.find(x=>x.id===b.dataset.marker);
if(m)alert(m.name+" · "+t(m.type));
}
);

let dragging=false;
let moved=false;
let lastX=0,lastY=0;
let startX=0,startY=0;

wrap.addEventListener("pointerdown",e=>{
if(e.target.closest("button"))return;
dragging=true;
moved=false;
startX=lastX=e.clientX;
startY=lastY=e.clientY;
wrap.setPointerCapture(e.pointerId);
});

wrap.addEventListener("pointermove",e=>{
if(!dragging)return;
if(Math.hypot(e.clientX-startX,e.clientY-startY)>7)
moved=true;

if(mapMode==="pan"){
offsetX+=e.clientX-lastX;
offsetY+=e.clientY-lastY;
transform();
}
lastX=e.clientX;
lastY=e.clientY;
});

wrap.addEventListener("pointerup",e=>{
if(!dragging)return;
dragging=false;
if(moved||mapMode==="pan")return;

const rect=wrap.getBoundingClientRect();
const cx=rect.width/2;
const cy=rect.height/2;

const px=(e.clientX-rect.left-cx-offsetX)/zoom+cx;
const py=(e.clientY-rect.top-cy-offsetY)/zoom+cy;

const x=px/rect.width*100;
const y=py/rect.height*100;

if(x<0||x>100||y<0||y>100)return;

if(mapMode==="player"){
player={x,y};
mapMode="pan";
save();render();
return;
}

if(mapMode==="target"){
target={x,y};
mapMode="pan";
save();render();
return;
}

if(mapMode==="marker"){
const name=prompt(t("markerName"));
if(!name?.trim())return;

const raw=prompt(t("markerType"),"other");
if(raw===null)return;

const type=types.includes(raw.trim().toLowerCase())
?raw.trim().toLowerCase():"other";

markers.push({
id:"m"+Date.now()+"-"+Math.random().toString(36).slice(2,8),
name:name.trim().slice(0,100),
type,x,y,completed:false
});
mapMode="pan";
save();render();
}
});

wrap.addEventListener("pointercancel",()=>{
dragging=false;
});

transform();
}

function setupSettings(){
document.getElementById("exportBtn").onclick=()=>{
const backup={
version:31,
progress,
markers,
player,
target,
exportedAt:new Date().toISOString()
};
const blob=new Blob(
[JSON.stringify(backup,null,2)],
{type:"application/json"}
);
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="crimson-guide-backup.json";
a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
};

document.getElementById("importBtn").onclick=()=>{
document.getElementById("backupFile").click();
};

document.getElementById("backupFile").onchange=async e=>{
try{
const file=e.target.files[0];
if(!file)return;
if(file.size>1000000)throw Error("size");

const data=JSON.parse(await file.text());
if(![1,2,3,31].includes(data.version)||
!data.progress||
typeof data.progress!=="object"||
Array.isArray(data.progress)){
throw Error("format");
}

const clean={};
for(let [key,value] of Object.entries(data.progress)){
if(key.length>160||typeof value!=="boolean")continue;
if(data.version===1&&key.startsWith("quests:")){
key="quest:"+key.slice(7);
}
clean[key]=value;
}
progress=clean;

if(Array.isArray(data.markers)){
markers=data.markers
.filter(m=>validPoint(m)&&typeof m.name==="string")
.slice(0,500)
.map(m=>({
id:String(m.id||"m"+Math.random()).slice(0,100),
name:m.name.slice(0,100),
type:types.includes(m.type)?m.type:"other",
x:m.x,y:m.y,
completed:m.completed===true
}));
}

if(data.version===31){
player=validPoint(data.player)?data.player:null;
target=validPoint(data.target)?data.target:null;
}

save();
alert(t("imported"));
render();
}catch{
alert(t("invalid"));
}
};

document.getElementById("resetBtn").onclick=()=>{
if(confirm(t("confirmReset"))){
progress={};
markers=[];
player=null;
target=null;
save();
render();
}
};
}

document.getElementById("lang").onchange=e=>{
language=e.target.value;
localStorage.setItem("crimson-guide-language",language);
render();
};

render();

if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("./sw.js").catch(console.warn);
});
}
</script>
